<script type="text/babel">
const {useState,useEffect,useMemo,useRef} = React;


const DIAS_ENTREGA = "Entregas de lunes a sábado, coordinando horario por WhatsApp.";
const STOCK_BAJO_UMBRAL = 5;

const CONFIG_DEFAULT = {
  adminUser: "demo",
  adminPass: "demo",
  whatsapp: "5490000000000",
  instagram: "",
  mapsQuery: "GOLO-MAS almacén mayorista",
  horarios: [
    {dia:"Lunes a Viernes", horario:"8:00 a 13:00 / 16:00 a 20:00"},
    {dia:"Sábados", horario:"8:00 a 13:00"},
    {dia:"Domingos", horario:"Cerrado"},
  ],
  pagos: {
    efectivo: true,
    transferencia: {activo:true, cbu:"", alias:""},
    mercadopago: {activo:true, qrUrl:""},
  }
};

const fmt = (n) => "$" + Number(n||0).toLocaleString("es-AR");

const IMG_FALLBACK = "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect width="200" height="200" fill="#1c1811"/><text x="100" y="105" font-size="14" fill="#7d7458" text-anchor="middle" font-family="sans-serif">Sin imagen</text></svg>');

function normalizarUrlImagen(url){
  if(!url) return url;
  url = url.trim();
  if(url.includes("drive.google.com")){
    const m = url.match(/\/file\/d\/([^/?]+)/) || url.match(/[?&]id=([^&]+)/);
    if(m && m[1]) return `https://lh3.googleusercontent.com/d/${m[1]}=w1000`;
  }
  return url;
}

function parseCSV(texto){
  const lineas = texto.split(/\r?\n/).filter(l=>l.trim()!=="");
  if(lineas.length<2) return [];
  const headers = lineas[0].split(",").map(h=>h.trim().replace(/^"|"$/g,'').toLowerCase());
  return lineas.slice(1).map(linea=>{
    const valores = []; let cur=""; let enComillas=false;
    for(let i=0;i<linea.length;i++){
      const ch = linea[i];
      if(ch==='"'){ enComillas=!enComillas; }
      else if(ch===',' && !enComillas){ valores.push(cur); cur=""; }
      else cur+=ch;
    }
    valores.push(cur);
    const obj = {};
    headers.forEach((h,i)=>obj[h]=(valores[i]||"").trim());
    return obj;
  });
}

const beep = () => {
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880; g.gain.value = 0.15;
    o.start(); o.stop(ctx.currentTime+0.18);
  }catch(e){}
};

const FAQ = [
  {q:"¿Cómo hago un pedido?", a:"Agregá los productos que quieras al carrito y después abrí el carrito para enviar tu pedido por WhatsApp o descargar el presupuesto en PDF."},
  {q:"¿Hacen envíos?", a:"Sí, hacemos envíos a comercios. Escribinos por WhatsApp con tu dirección para confirmar zona y costo de envío."},
  {q:"¿Diferencia entre precio mayorista y minorista?", a:"El precio mayorista aplica desde la cantidad mínima indicada en cada producto, o activando el modo 'Por mayor' arriba del catálogo."},
  {q:"¿Cómo pago?", a:"Coordinamos la forma de pago por WhatsApp una vez confirmado el pedido."},
  {q:"Quiero hablar con una persona", a:"__WHATSAPP__"},
];

function App(){
  const [productos,setProductos] = useState([]);
  const [categorias,setCategorias] = useState([]);
  const [catActiva,setCatActiva] = useState("todas");
  const [busqueda,setBusqueda] = useState("");
  const [modoPrecio,setModoPrecio] = useState("minorista");
  const [carrito,setCarrito] = useState([]);
  const [drawerOpen,setDrawerOpen] = useState(false);
  const [chatOpen,setChatOpen] = useState(false);
  const [preguntaActiva,setPreguntaActiva] = useState(null);
  const [presupuestoOpen,setPresupuestoOpen] = useState(false);
  const [datosCliente,setDatosCliente] = useState({nombre:"",telefono:""});

  const [clientes,setClientes] = useState([]);
  const [pedidos,setPedidos] = useState([]);
  const [clienteActual,setClienteActual] = useState(null);
  const [loginOpen,setLoginOpen] = useState(false);
  const [loginNumero,setLoginNumero] = useState("");
  const [loginPass,setLoginPass] = useState("");
  const [loginError,setLoginError] = useState("");
  const [historialOpen,setHistorialOpen] = useState(false);

  const [adminModalOpen,setAdminModalOpen] = useState(false);
  const [adminLogged,setAdminLogged] = useState(false);
  const [userInput,setUserInput] = useState("");
  const [passInput,setPassInput] = useState("");
  const [loginAdminError,setLoginAdminError] = useState("");
  const [adminTab,setAdminTab] = useState("productos");
  const [editando,setEditando] = useState(null);
  const [editandoCliente,setEditandoCliente] = useState(null);
  const [seleccionados,setSeleccionados] = useState([]);
  const [pctAumento,setPctAumento] = useState("");
  const [escanerAbierto,setEscanerAbierto] = useState(false);
  const [productoEscaneado,setProductoEscaneado] = useState(null);
  const [manualBarcode,setManualBarcode] = useState("");
  const [adminHistorialCliente,setAdminHistorialCliente] = useState(null);
  const [combos,setCombos] = useState([]);
  const [categoriasLista,setCategoriasLista] = useState([]);
  const [nuevaCategoria,setNuevaCategoria] = useState("");
  const [statsCategoria,setStatsCategoria] = useState("todas");
  const [editandoCombo,setEditandoCombo] = useState(null);
  const [toastPedido,setToastPedido] = useState(null);
  const prevRecibidosRef = useRef(0);
  const primerCargaRef = useRef(true);
  const [config,setConfig] = useState(CONFIG_DEFAULT);
  const [qrModalOpen,setQrModalOpen] = useState(false);

  useEffect(()=>{
    const ref = db.ref("productos");
    ref.on("value", snap=>{
      const val = snap.val() || {};
      const list = Object.entries(val).map(([id,p])=>({id,...p}));
      setProductos(list);
      setCategorias(Array.from(new Set(list.map(p=>p.categoria||"General"))));
    });
    const refC = db.ref("clientes");
    refC.on("value", snap=>{
      const val = snap.val() || {};
      setClientes(Object.entries(val).map(([id,c])=>({id,...c})));
    });
    const refP = db.ref("pedidos");
    refP.on("value", snap=>{
      const val = snap.val() || {};
      setPedidos(Object.entries(val).map(([id,p])=>({id,...p})));
    });
    const refCombos = db.ref("combos");
    refCombos.on("value", snap=>{
      const val = snap.val() || {};
      setCombos(Object.entries(val).map(([id,c])=>({id,...c})));
    });
    const refCategorias = db.ref("categorias");
    refCategorias.on("value", snap=>{
      const val = snap.val() || {};
      setCategoriasLista(Object.entries(val).map(([id,c])=>({id,nombre:c.nombre||c})));
    });
    const refConfig = db.ref("config");
    refConfig.on("value", snap=>{
      const val = snap.val();
      if(val){
        setConfig({
          ...CONFIG_DEFAULT, ...val,
          horarios: val.horarios || CONFIG_DEFAULT.horarios,
          pagos: {
            efectivo: val.pagos?.efectivo ?? CONFIG_DEFAULT.pagos.efectivo,
            transferencia: {...CONFIG_DEFAULT.pagos.transferencia, ...(val.pagos?.transferencia||{})},
            mercadopago: {...CONFIG_DEFAULT.pagos.mercadopago, ...(val.pagos?.mercadopago||{})},
          }
        });
      }
    });
    return ()=>{ref.off();refC.off();refP.off();refCombos.off();refCategorias.off();refConfig.off();};
  },[]);

  useEffect(()=>{
    const recibidos = pedidos.filter(p=>p.estado==="recibido");
    if(primerCargaRef.current){ primerCargaRef.current=false; prevRecibidosRef.current = recibidos.length; return; }
    if(recibidos.length > prevRecibidosRef.current){
      const nuevo = recibidos.sort((a,b)=>new Date(b.fecha)-new Date(a.fecha))[0];
      beep();
      setToastPedido(nuevo);
      setTimeout(()=>setToastPedido(t=> t && t.id===nuevo.id ? null : t), 6000);
    }
    prevRecibidosRef.current = recibidos.length;
  },[pedidos]);

  const clienteInfo = clienteActual ? (clientes.find(c=>c.id===clienteActual.id) || clienteActual) : null;

  const productosFiltrados = useMemo(()=>{
    return productos.filter(p=>{
      if(catActiva==="favoritos"){
        if(!clienteInfo || !(clienteInfo.favoritos||[]).includes(p.id)) return false;
      } else {
        const okCat = catActiva==="todas" || (p.categoria||"General")===catActiva;
        if(!okCat) return false;
      }
      const okBusq = !busqueda || (p.nombre||"").toLowerCase().includes(busqueda.toLowerCase());
      return okBusq;
    });
  },[productos,catActiva,busqueda,clienteInfo]);

  const precioProducto = (p, cantidad, modo) => {
    const usarMayorista = modo==="mayorista" || (p.cantMinMayorista && cantidad >= Number(p.cantMinMayorista));
    let base = (usarMayorista && p.precioMayorista) ? Number(p.precioMayorista) : Number(p.precioMinorista||0);
    if(clienteInfo && Number(clienteInfo.descuento)>0){
      base = Math.round(base * (1 - Number(clienteInfo.descuento)/100));
    }
    return base;
  };

  const agregarAlCarrito = (p, cantidad) => {
    if(cantidad<=0) return;
    setCarrito(prev=>{
      const existe = prev.find(i=>i.id===p.id);
      if(existe) return prev.map(i=>i.id===p.id?{...i,cantidad:i.cantidad+cantidad}:i);
      return [...prev,{id:p.id,nombre:p.nombre,imagen:p.imagen,categoria:p.categoria,cantidad}];
    });
    setDrawerOpen(true);
  };
  const cambiarCantidadCarrito = (id, delta) => {
    setCarrito(prev=>prev.map(i=>i.id===id?{...i,cantidad:Math.max(1,i.cantidad+delta)}:i).filter(i=>i.cantidad>0));
  };
  const quitarDelCarrito = (id) => setCarrito(prev=>prev.filter(i=>i.id!==id));

  const carritoConPrecios = useMemo(()=>{
    return carrito.map(item=>{
      if(item.esCombo){
        return {...item, precioUnit:item.precioCombo, subtotal:item.precioCombo*item.cantidad};
      }
      const p = productos.find(x=>x.id===item.id) || {};
      const precioUnit = precioProducto(p,item.cantidad,modoPrecio);
      return {...item, precioUnit, subtotal: precioUnit*item.cantidad};
    });
  },[carrito,productos,modoPrecio,clienteActual,clientes]);

  const totalCarrito = carritoConPrecios.reduce((s,i)=>s+i.subtotal,0);
  const cantidadCarrito = carrito.reduce((s,i)=>s+i.cantidad,0);
  const cantidadEnCarritoDe = (id) => (carrito.find(i=>i.id===id)||{}).cantidad || 0;

  const hacerLogin = () => {
    setLoginError("");
    const c = clientes.find(x=> String(x.numero)===String(loginNumero).trim() && String(x.password)===String(loginPass));
    if(!c){ setLoginError("Número de cliente o contraseña incorrectos."); return; }
    setClienteActual(c); setLoginOpen(false); setLoginNumero(""); setLoginPass("");
  };

  const generarPDF = () => {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.setFont("helvetica","bold"); doc.setFontSize(18);
    doc.text("GOLO-MAS", 14, 18);
    doc.setFontSize(11); doc.setFont("helvetica","normal");
    doc.text("Presupuesto - " + new Date().toLocaleDateString("es-AR"), 14, 26);
    if(datosCliente.nombre) doc.text("Cliente: " + datosCliente.nombre, 14, 33);
    if(datosCliente.telefono) doc.text("Teléfono: " + datosCliente.telefono, 14, 39);
    let y = 50;
    doc.setFont("helvetica","bold");
    doc.text("Producto",14,y); doc.text("Cant.",120,y); doc.text("P. unit.",145,y); doc.text("Subtotal",175,y);
    doc.setFont("helvetica","normal"); y+=6;
    carritoConPrecios.forEach(i=>{
      doc.text(String(i.nombre).slice(0,40),14,y);
      doc.text(String(i.cantidad),120,y);
      doc.text(fmt(i.precioUnit),145,y);
      doc.text(fmt(i.subtotal),175,y);
      y+=7; if(y>270){doc.addPage();y=20;}
    });
    y+=4; doc.setFont("helvetica","bold");
    doc.text("TOTAL: " + fmt(totalCarrito), 14, y); y+=10;
    doc.setFontSize(9); doc.setFont("helvetica","italic");
    doc.text("No incluye costo de envío. Precios sujetos a variación sin previo aviso.",14,y);
    doc.save("presupuesto-golo-mas.pdf");
  };

  const confirmarPedido = () => {
    if(!clienteActual || carrito.length===0) return;
    const ref = db.ref("pedidos").push();
    db.ref("pedidos/"+ref.key).set({
      id: ref.key, clienteId: clienteActual.id,
      clienteNombre: clienteActual.nombre || clienteActual.numero,
      items: carritoConPrecios.map(i=>({id:i.id,nombre:i.nombre,cantidad:i.cantidad,precioUnit:i.precioUnit,subtotal:i.subtotal,esCombo:!!i.esCombo,componentes:i.componentes||null})),
      total: totalCarrito, estado: "recibido", fecha: new Date().toISOString()
    });
    setCarrito([]); setDrawerOpen(false);
    alert("¡Pedido enviado! Podés ver su estado en 'Mis pedidos'.");
  };

  const guardarProducto = (data) => {
    const limpio = {...data, imagen: normalizarUrlImagen(data.imagen)};
    if(limpio.id){ db.ref("productos/"+limpio.id).update(limpio); }
    else{ const newRef = db.ref("productos").push(); db.ref("productos/"+newRef.key).set({...limpio, id:newRef.key}); }
    setEditando(null);
  };
  const borrarProducto = (id) => { if(confirm("¿Borrar este producto?")) db.ref("productos/"+id).remove(); };
  const toggleSeleccion = (id) => setSeleccionados(prev=> prev.includes(id) ? prev.filter(x=>x!==id) : [...prev,id]);
  const aplicarAumento = () => {
    const pct = Number(pctAumento); if(!pct) return;
    seleccionados.forEach(id=>{
      const p = productos.find(x=>x.id===id); if(!p) return;
      const nuevoMin = Math.round(Number(p.precioMinorista||0)*(1+pct/100));
      const nuevoMay = p.precioMayorista ? Math.round(Number(p.precioMayorista)*(1+pct/100)) : p.precioMayorista;
      db.ref("productos/"+id).update({precioMinorista:nuevoMin, precioMayorista:nuevoMay});
    });
    setSeleccionados([]); setPctAumento("");
  };

  const guardarCliente = (data) => {
    if(data.id){ db.ref("clientes/"+data.id).update(data); }
    else{ const newRef = db.ref("clientes").push(); db.ref("clientes/"+newRef.key).set({...data, id:newRef.key}); }
    setEditandoCliente(null);
  };
  const borrarCliente = (id) => { if(confirm("¿Borrar este cliente?")) db.ref("clientes/"+id).remove(); };
  const ESTADOS_PEDIDO = ["recibido","en proceso","en proceso de entrega","entregado"];
  const cambiarEstadoPedido = (id, estado) => {
    db.ref("pedidos/"+id).update({estado});
    if(estado==="entregado"){
      const p = pedidos.find(x=>x.id===id);
      (p?.items||[]).forEach(it=>{
        if(it.esCombo && it.componentes){
          it.componentes.forEach(comp=>{
            const prod = productos.find(x=>x.id===comp.productId || x.nombre===comp.nombre);
            if(prod && prod.stock!==undefined && prod.stock!==""){
              db.ref("productos/"+prod.id).update({stock: Math.max(0, Number(prod.stock)-Number(comp.cantidad)*Number(it.cantidad))});
            }
          });
          return;
        }
        const prod = productos.find(x=>x.nombre===it.nombre);
        if(prod && prod.stock!==undefined && prod.stock!==""){
          db.ref("productos/"+prod.id).update({stock: Math.max(0, Number(prod.stock)-Number(it.cantidad))});
        }
      });
    }
  };

  const ajustarStock = (id, delta) => {
    const p = productos.find(x=>x.id===id); if(!p) return;
    const nuevo = Math.max(0, Number(p.stock||0)+delta);
    db.ref("productos/"+id).update({stock:nuevo});
  };
  const fijarStock = (id, valor) => {
    db.ref("productos/"+id).update({stock: Math.max(0, Number(valor)||0)});
  };
  const onCodigoEscaneado = (codigo) => {
    setEscanerAbierto(false);
    const p = productos.find(x=>String(x.codigoBarras||"")===String(codigo));
    if(p) setProductoEscaneado(p);
    else setProductoEscaneado({nuevo:true, codigoBarras:codigo});
  };

  const intentarLoginAdmin = () => {
    if(userInput===config.adminUser && passInput===config.adminPass){
      setAdminLogged(true); setLoginAdminError(""); setUserInput(""); setPassInput("");
    } else setLoginAdminError("Usuario o contraseña incorrectos");
  };

  const guardarConfig = (nuevaConfig) => {
    db.ref("config").set(nuevaConfig).then(()=>alert("Configuración guardada."));
  };

  const categoriasConProductos = categorias.filter(c=>productos.some(p=>(p.categoria||"General")===c));
  const productosDestacados = productos.filter(p=>p.destacado);

  const toggleFavorito = (productId) => {
    if(!clienteInfo) return;
    const favoritos = clienteInfo.favoritos || [];
    const nuevos = favoritos.includes(productId) ? favoritos.filter(id=>id!==productId) : [...favoritos, productId];
    db.ref("clientes/"+clienteInfo.id).update({favoritos:nuevos});
  };

  const repetirUltimoPedido = () => {
    if(!clienteInfo) return;
    const propios = pedidos.filter(p=>p.clienteId===clienteInfo.id).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
    if(propios.length===0){ alert("Todavía no tenés pedidos anteriores."); return; }
    const ultimo = propios[0];
    let agregados = 0;
    (ultimo.items||[]).forEach(it=>{
      const prod = productos.find(p=>p.id===it.id) || productos.find(p=>p.nombre===it.nombre);
      if(prod){ agregarAlCarrito(prod, it.cantidad); agregados++; }
    });
    if(agregados===0) alert("Los productos de ese pedido ya no están disponibles.");
  };

  const guardarCombo = (data) => {
    const limpio = {...data, imagen: normalizarUrlImagen(data.imagen)};
    if(limpio.id){ db.ref("combos/"+limpio.id).update(limpio); }
    else{ const newRef = db.ref("combos").push(); db.ref("combos/"+newRef.key).set({...limpio, id:newRef.key}); }
    setEditandoCombo(null);
  };

  const agregarCategoria = () => {
    const nombre = nuevaCategoria.trim(); if(!nombre) return;
    if(categoriasLista.some(c=>c.nombre.toLowerCase()===nombre.toLowerCase())){ setNuevaCategoria(""); return; }
    const newRef = db.ref("categorias").push();
    db.ref("categorias/"+newRef.key).set({nombre});
    setNuevaCategoria("");
  };
  const borrarCategoria = (id) => { if(confirm("¿Borrar esta categoría? Los productos que ya la tienen cargada no se modifican.")) db.ref("categorias/"+id).remove(); };
  const borrarCombo = (id) => { if(confirm("¿Borrar este combo?")) db.ref("combos/"+id).remove(); };
  const agregarComboAlCarrito = (combo) => {
    setCarrito(prev=>{
      const existe = prev.find(i=>i.id==="combo:"+combo.id);
      if(existe) return prev.map(i=>i.id===existe.id?{...i,cantidad:i.cantidad+1}:i);
      return [...prev, {id:"combo:"+combo.id, nombre:"🎁 "+combo.nombre, imagen:combo.imagen, cantidad:1, esCombo:true, precioCombo:Number(combo.precioCombo), componentes:combo.componentes||[]}];
    });
    setDrawerOpen(true);
  };

  const exportarCSV = (filas, nombreArchivo) => {
    const csv = filas.map(fila=>fila.map(c=>`"${String(c??"").replace(/"/g,'""')}"`).join(",")).join("\n");
    const blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8;"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = nombreArchivo; a.click();
    URL.revokeObjectURL(url);
  };
  const descargarPlantillaCSV = () => {
    exportarCSV([
      ["nombre","categoria","precioMinorista","precioMayorista","cantMinMayorista","codigoBarras","stock","imagen"],
      ["Arroz 1kg","Almacén","1200","1000","6","7791234567890","50","https://..."],
    ], "plantilla-productos-golo-mas.csv");
  };

  const importarProductosCSV = (file) => {
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try{
        const filas = parseCSV(e.target.result);
        const updates = {};
        let cargados = 0;
        filas.forEach(f=>{
          if(!f.nombre) return;
          const newRef = db.ref("productos").push();
          updates["productos/"+newRef.key] = {
            id: newRef.key,
            nombre: f.nombre,
            categoria: f.categoria || "General",
            precioMinorista: Number(f.preciominorista)||0,
            precioMayorista: Number(f.preciomayorista)||0,
            cantMinMayorista: f.cantminmayorista || "",
            codigoBarras: f.codigobarras || "",
            stock: f.stock || "",
            imagen: f.imagen || "",
            agotado: false, destacado: false
          };
          cargados++;
        });
        if(cargados===0){ alert("No se encontraron filas válidas (revisá que la columna 'nombre' esté completa)."); return; }
        db.ref().update(updates).then(()=>alert(`Se importaron ${cargados} productos correctamente.`));
      }catch(err){
        alert("No se pudo leer el archivo. Revisá que sea un CSV con el formato de la plantilla.");
      }
    };
    reader.readAsText(file, "UTF-8");
  };

  const exportarPedidosCSV = () => {
    const filas = [["Fecha","Cliente","Total","Estado","Items"]];
    pedidos.forEach(p=>filas.push([new Date(p.fecha).toLocaleString("es-AR"), p.clienteNombre, p.total, p.estado, (p.items||[]).map(i=>`${i.cantidad}x ${i.nombre}`).join(" | ")]));
    exportarCSV(filas, "pedidos-golo-mas.csv");
  };
  const exportarClientesCSV = () => {
    const filas = [["Número","Nombre","Teléfono","Dirección","CUIL","Descuento %"]];
    clientes.forEach(c=>filas.push([c.numero,c.nombre,c.telefono,c.direccion,c.cuil,c.descuento||0]));
    exportarCSV(filas, "clientes-golo-mas.csv");
  };

  const imprimirTicket = () => {
    const win = window.open("","_blank","width=380,height=600");
    const filas = carritoConPrecios.map(i=>`<tr><td>${i.cantidad}x ${i.nombre}</td><td style="text-align:right">${fmt(i.subtotal)}</td></tr>`).join("");
    win.document.write(`
      <html><head><title>Ticket GOLO-MAS</title><style>
        body{font-family:monospace;padding:16px;width:280px;}
        h2{text-align:center;margin:0 0 4px;} p{text-align:center;margin:0 0 10px;font-size:12px;}
        table{width:100%;border-collapse:collapse;font-size:12px;} td{padding:3px 0;border-bottom:1px dashed #999;}
        .total{font-weight:bold;font-size:14px;border-top:2px solid #000;margin-top:8px;padding-top:8px;display:flex;justify-content:space-between;}
      </style></head><body>
        <h2>GOLO-MAS</h2><p>${new Date().toLocaleString("es-AR")}</p>
        <table>${filas}</table>
        <div class="total"><span>TOTAL</span><span>${fmt(totalCarrito)}</span></div>
        <p style="margin-top:14px">¡Gracias por su compra!</p>
      </body></html>
    `);
    win.document.close(); win.focus(); win.print();
  };

                  <ProductCard p={p} modoPrecio={modoPrecio} precioProducto={precioProducto} agregarAlCarrito={agregarAlCarrito} clienteInfo={clienteInfo} toggleFavorito={toggleFavorito} cantidadEnCarrito={cantidadEnCarritoDe(p.id)} />
                </div>
              ))}
            </div>
          </div>

        {/* ===== COMBOS ===== */}
        {combos.length>0 && (
          <div className="mb-6">
            <h2 className="font-heading text-sm mb-3 flex items-center gap-2"><i className="fa-solid fa-gift text-marca-500"></i>Combos especiales</h2>
            <div className="flex gap-3 overflow-x-auto no-scrollbar pb-1">
              {combos.map(c=>(
                <div key={c.id} className="w-56 flex-shrink-0 tarjeta-prod rounded-2xl p-3 flex gap-3 items-center">
                  {c.imagen ? <img src={c.imagen} onError={e=>{e.target.onerror=null;e.target.src=IMG_FALLBACK;}} className="w-16 h-16 rounded-xl object-cover flex-shrink-0" /> : <div className="w-16 h-16 rounded-xl bg-white/5 flex items-center justify-center text-carbon-600 flex-shrink-0"><i className="fa-solid fa-gift"></i></div>}
                  <div className="min-w-0 flex-1">
                    <p className="text-[13px] font-bold truncate">{c.nombre}</p>
                    <p className="font-price text-ambar-400 text-base">{fmt(c.precioCombo)}</p>
                    <button onClick={()=>agregarComboAlCarrito(c)} className="mt-1 w-full bg-gradient-to-br from-marca-400 to-marca-600 text-white text-[11px] font-bold py-1.5 rounded-lg active:scale-95 transition">Agregar combo</button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* ===== BUSCADOR + FILTROS (barra flotante) ===== */}
        <div className="cristal border border-carbon-700/60 rounded-2xl shadow-2xl p-3 mb-6 animate-fade-in">

            <div className="relative flex-1">
              <input value={busqueda} onChange={e=>setBusqueda(e.target.value)} placeholder="Buscar producto..."
                className="input-oscuro w-full rounded-xl py-3 pl-11 pr-4 text-sm font-medium transition" />
              <i className="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-carbon-400 text-sm"></i>
            </div>
            <div className="flex bg-white/[.04] border border-carbon-700 rounded-xl p-1 flex-shrink-0">
              {[["minorista","Por menor"],["mayorista","Por mayor"]].map(([id,label])=>(
                <button key={id} onClick={()=>setModoPrecio(id)}
                  className={`px-3.5 py-2 rounded-lg text-xs font-bold transition-all ${modoPrecio===id?'bg-gradient-to-br from-marca-400 to-marca-600 text-white shadow-glow-marca':'text-carbon-300'}`}>{label}</button>

          <div className="flex gap-2 overflow-x-auto no-scrollbar">
            <button onClick={()=>setCatActiva("todas")}
              className={`whitespace-nowrap px-4 py-1.5 rounded-full font-bold text-[12px] transition-all ${catActiva==="todas"?'bg-gradient-to-br from-ambar-300 to-ambar-500 text-carbon-900':'bg-white/[.04] text-carbon-300 border border-carbon-700'}`}>Todas</button>
            {clienteInfo && (
              <button onClick={()=>setCatActiva("favoritos")}
                className={`whitespace-nowrap px-4 py-1.5 rounded-full font-bold text-[12px] transition-all flex items-center gap-1.5 ${catActiva==="favoritos"?'bg-gradient-to-br from-ambar-300 to-ambar-500 text-carbon-900':'bg-white/[.04] text-carbon-300 border border-carbon-700'}`}><i className="fa-solid fa-heart text-[11px]"></i>Favoritos</button>
            )}
            {categoriasConProductos.map(c=>(
              <button key={c} onClick={()=>setCatActiva(c)}
                className={`whitespace-nowrap px-4 py-1.5 rounded-full font-bold text-[12px] tracking-wide transition-all ${catActiva===c?'bg-gradient-to-br from-ambar-300 to-ambar-500 text-carbon-900':'bg-white/[.04] text-carbon-300 border border-carbon-700'}`}>{c}</button>
            ))}
          </div>
        </div>

        {/* ===== GRILLA ===== */}
        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3.5 mb-10">
          {productosFiltrados.length===0 && (
            <div className="col-span-full text-center py-16 text-carbon-500">
              <i className="fa-solid fa-box-open text-4xl mb-3 opacity-50"></i>
              <p className="font-bold">No hay productos cargados todavía.</p>
            </div>
          )}
          {productosFiltrados.map(p=>(
            <ProductCard key={p.id} p={p} modoPrecio={modoPrecio} precioProducto={precioProducto} agregarAlCarrito={agregarAlCarrito} clienteInfo={clienteInfo} toggleFavorito={toggleFavorito} cantidadEnCarrito={cantidadEnCarritoDe(p.id)} />
          ))}
        </div>

        {/* ===== MAPS + HORARIOS ===== */}
        <div className="grid sm:grid-cols-2 gap-4 mb-8">
          <div className="cristal border border-carbon-700/60 rounded-2xl p-4">
            <h3 className="font-heading text-base mb-3"><i className="fa-solid fa-location-dot text-marca-500 mr-1.5"></i>Dónde estamos</h3>
            <iframe className="w-full h-56 rounded-xl border-0 grayscale-[.2]" loading="lazy" src={"https://www.google.com/maps?q="+encodeURIComponent(config.mapsQuery)+"&output=embed"}></iframe>
          </div>
          <div className="cristal border border-carbon-700/60 rounded-2xl p-5">
            <h3 className="font-heading text-base mb-3"><i className="fa-regular fa-clock text-ambar-400 mr-1.5"></i>Horarios de atención</h3>
            <div className="space-y-2.5 mb-4">
              {config.horarios.map(h=>(
                <div key={h.dia} className="flex justify-between text-sm border-b border-carbon-700/60 pb-2">
                  <span className="text-carbon-300 font-semibold">{h.dia}</span>

                <button onClick={agregarCategoria} className="bg-gradient-to-br from-ambar-300 to-ambar-500 text-carbon-900 px-4 rounded-xl text-sm font-bold shadow-glow-ambar active:scale-95 transition"><i className="fa-solid fa-plus mr-1"></i>Agregar</button>

                {categoriasLista.map(c=>(

                    <button onClick={()=>borrarCategoria(c.id)} className="w-8 h-8 rounded-lg bg-marca-500/10 hover:bg-marca-500/20 text-marca-400 flex items-center justify-center transition"><i className="fa-solid fa-trash-can text-xs"></i></button>
                  </div>

              </div>
            </div>

              {combos.length===0 && <p className="text-carbon-500 text-sm text-center py-6">No hay combos cargados todavía.</p>}

                  {c.imagen ? <img src={c.imagen} onError={e=>{e.target.onerror=null;e.target.src=IMG_FALLBACK;}} className="w-12 h-12 rounded-lg object-cover flex-shrink-0" /> : <div className="w-12 h-12 rounded-lg bg-white/5 flex items-center justify-center text-carbon-600 flex-shrink-0"><i className="fa-solid fa-gift"></i></div>}
                  <div className="flex-1 min-w-0">
                    <p className="font-bold text-sm truncate text-carbon-100">{c.nombre}</p>
                    <p className="text-xs text-ambar-400 font-heading">{fmt(c.precioCombo)}</p>
                    <p className="text-[10.5px] text-carbon-500 truncate">{(c.componentes||[]).map(comp=>`${comp.cantidad}x ${comp.nombre}`).join(", ")}</p>

                  <button onClick={()=>setEditandoCombo(c)} className="w-8 h-8 rounded-lg bg-white/5 hover:bg-white/10 text-carbon-300 flex items-center justify-center transition"><i className="fa-solid fa-pen text-xs"></i></button>
                  <button onClick={()=>borrarCombo(c.id)} className="w-8 h-8 rounded-lg bg-marca-500/10 hover:bg-marca-500/20 text-marca-400 flex items-center justify-center transition"><i className="fa-solid fa-trash-can text-xs"></i></button>
                </div>
              ))}

          {adminTab==="clientes" && (
            <div className="space-y-3">
              <div className="flex gap-2">
                <button onClick={()=>setEditandoCliente("nuevo")} className="bg-gradient-to-br from-ambar-300 to-ambar-500 text-carbon-900 px-4 py-2.5 rounded-xl text-sm font-bold shadow-glow-ambar active:scale-95 transition"><i className="fa-solid fa-plus mr-1"></i>Nuevo cliente</button>
                {clientes.length>0 && <button onClick={exportarClientesCSV} className="bg-white/5 border border-carbon-700 text-carbon-200 px-4 py-2.5 rounded-xl text-sm font-bold hover:bg-white/10 transition"><i className="fa-solid fa-file-csv mr-1"></i>Exportar CSV</button>}

                    <p className="font-bold text-sm truncate text-carbon-100">{c.nombre} <span className="text-carbon-500 font-normal">· Nº {c.numero}</span></p>

                  <button onClick={()=>setAdminHistorialCliente(c)} className="w-8 h-8 rounded-lg bg-white/5 hover:bg-white/10 text-carbon-300 flex items-center justify-center transition"><i className="fa-solid fa-clock-rotate-left text-xs"></i></button>
                  <button onClick={()=>setEditandoCliente(c)} className="w-8 h-8 rounded-lg bg-white/5 hover:bg-white/10 text-carbon-300 flex items-center justify-center transition"><i className="fa-solid fa-pen text-xs"></i></button>
                  <button onClick={()=>borrarCliente(c.id)} className="w-8 h-8 rounded-lg bg-marca-500/10 hover:bg-marca-500/20 text-marca-400 flex items-center justify-center transition"><i className="fa-solid fa-trash-can text-xs"></i></button>
                </div>
              ))}
            </div>
          )}

          {adminTab==="pedidos" && (
            <div className="space-y-3">
              {pedidos.length>0 && <button onClick={exportarPedidosCSV} className="bg-white/5 border border-carbon-700 text-carbon-200 px-4 py-2.5 rounded-xl text-sm font-bold hover:bg-white/10 transition"><i className="fa-solid fa-file-csv mr-1"></i>Exportar CSV</button>}

                <div key={p.id} className="bg-white/[.03] border border-carbon-700 rounded-xl p-3.5">
                  <div className="flex justify-between items-start mb-1.5">
                    <div>
                      <p className="font-heading text-sm">{p.clienteNombre}</p>
                      <p className="text-[10px] text-carbon-500">{new Date(p.fecha).toLocaleString("es-AR")}</p>
                    </div>
                    <p className="font-heading text-ambar-400">{fmt(p.total)}</p>
                  </div>

                      <button key={est} onClick={()=>cambiarEstadoPedido(p.id,est)}

                        {est}
                      </button>
                    ))}
                  </div>
                </div>

                {productos.map(p=>{
                  const bajo = p.stock!==undefined && p.stock!=="" && Number(p.stock)<=STOCK_BAJO_UMBRAL;
                  return (
                  <div key={p.id} className={`flex items-center gap-3 bg-white/[.03] border rounded-xl p-3 ${bajo?'border-marca-500/40':'border-carbon-700'}`}>
                    <div className="flex-1 min-w-0">
                      <p className="font-bold text-sm truncate text-carbon-100">{p.nombre}{bajo && <span className="ml-2 text-[9px] bg-marca-500/20 text-marca-300 px-1.5 py-0.5 rounded-full">STOCK BAJO</span>}</p>
                      <p className="text-[11px] text-carbon-500">{p.codigoBarras || "sin código"}</p>
                    </div>
                    <button onClick={()=>ajustarStock(p.id,-1)} className="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 font-bold active:scale-90 transition">-</button>
                    <span className="w-8 text-center font-heading text-sm text-ambar-400">{p.stock!==undefined && p.stock!=="" ? p.stock : "—"}</span>
                    <button onClick={()=>ajustarStock(p.id,1)} className="w-8 h-8 rounded-full bg-gradient-to-br from-marca-400 to-marca-600 font-bold active:scale-90 transition">+</button>
                  </div>
                  );
                })}
                {productos.length===0 && <p className="text-carbon-500 text-sm text-center py-6">No hay productos cargados.</p>}
              </div>
            </div>
          )}

          {adminTab==="estadisticas" && (()=>{
            const pedidosValidos = pedidos.filter(p=>p.estado!=="rechazado");
            const catDeItem = (it) => {
              if(it.esCombo) return "Combos";
              const prod = productos.find(x=>x.id===it.id) || productos.find(x=>x.nombre===it.nombre);
              return prod?.categoria || "Sin categoría";
            };

            const ventasPorCategoria = {};
            pedidosValidos.forEach(p=>(p.items||[]).forEach(it=>{
              const cat = catDeItem(it);
              ventasPorCategoria[cat] = (ventasPorCategoria[cat]||0) + Number(it.subtotal||0);
            }));
            const topCategorias = Object.entries(ventasPorCategoria).sort((a,b)=>b[1]-a[1]);
            const maxCat = topCategorias.length ? topCategorias[0][1] : 1;
            const opcionesCategoria = ["todas", ...topCategorias.map(([cat])=>cat)];

            const ventasPorProducto = {};
            pedidosValidos.forEach(p=>(p.items||[]).forEach(it=>{
              if(statsCategoria!=="todas" && catDeItem(it)!==statsCategoria) return;
              ventasPorProducto[it.nombre] = (ventasPorProducto[it.nombre]||0) + Number(it.cantidad||0);
            }));
            const topProductos = Object.entries(ventasPorProducto).sort((a,b)=>b[1]-a[1]).slice(0,10);
            const maxProd = topProductos.length ? topProductos[0][1] : 1;

            const comprasPorCliente = {};
            pedidosValidos.forEach(p=>{
              const itemsRelevantes = statsCategoria==="todas" ? (p.items||[]) : (p.items||[]).filter(it=>catDeItem(it)===statsCategoria);
              if(itemsRelevantes.length===0) return;
              const totalRelevante = itemsRelevantes.reduce((s,it)=>s+Number(it.subtotal||0),0);
              const key = p.clienteId || p.clienteNombre;
              if(!comprasPorCliente[key]) comprasPorCliente[key] = {nombre:p.clienteNombre, total:0, pedidos:0};
              comprasPorCliente[key].total += totalRelevante;
              comprasPorCliente[key].pedidos += 1;
            });
            const topClientes = Object.values(comprasPorCliente).sort((a,b)=>b.total-a.total).slice(0,10);
            const maxCli = topClientes.length ? topClientes[0].total : 1;

            return (
              <div className="space-y-7">
                <div>
                  <h3 className="font-heading text-sm mb-3.5"><i className="fa-solid fa-layer-group text-ambar-400 mr-1.5"></i>Ingresos por categoría</h3>
                  {topCategorias.length===0 && <p className="text-carbon-500 text-sm">Todavía no hay pedidos confirmados.</p>}
                  <div className="space-y-3">
                    {topCategorias.map(([cat,total])=>(
                      <div key={cat}>
                        <div className="flex justify-between text-xs font-semibold mb-1.5 text-carbon-200"><span>{cat}</span><span className="text-ambar-400">{fmt(total)}</span></div>
                        <div className="bg-white/5 rounded-full h-2"><div className="bg-gradient-to-r from-emerald-500 to-emerald-300 h-2 rounded-full" style={{width:(total/maxCat*100)+"%"}}></div></div>
                      </div>
                    ))}
                  </div>
                </div>

                {opcionesCategoria.length>1 && (
                  <div className="flex items-center gap-2">
                    <span className="text-[11px] font-bold text-carbon-400 tracking-wide">FILTRAR POR CATEGORÍA</span>
                    <select value={statsCategoria} onChange={e=>setStatsCategoria(e.target.value)} className="input-oscuro rounded-lg p-2 text-xs">
                      {opcionesCategoria.map(c=><option key={c} value={c} className="bg-carbon-850">{c==="todas"?"Todas":c}</option>)}
                    </select>
                  </div>
                )}

                <div>
                  <h3 className="font-heading text-sm mb-3.5"><i className="fa-solid fa-fire text-marca-500 mr-1.5"></i>Productos más vendidos{statsCategoria!=="todas" && <span className="text-carbon-500 font-sans font-normal"> — {statsCategoria}</span>}</h3>
                  {topProductos.length===0 && <p className="text-carbon-500 text-sm">Todavía no hay pedidos confirmados{statsCategoria!=="todas" ? " en esta categoría" : ""}.</p>}
                  <div className="space-y-3">
                    {topProductos.map(([nombre,cant])=>(
                      <div key={nombre}>
                        <div className="flex justify-between text-xs font-semibold mb-1.5 text-carbon-200"><span>{nombre}</span><span className="text-ambar-400">{cant} u.</span></div>
                        <div className="bg-white/5 rounded-full h-2"><div className="bg-gradient-to-r from-marca-500 to-marca-400 h-2 rounded-full" style={{width:(cant/maxProd*100)+"%"}}></div></div>
                      </div>
                    ))}
                  </div>
                </div>
                <div>
                  <h3 className="font-heading text-sm mb-3.5"><i className="fa-solid fa-crown text-ambar-400 mr-1.5"></i>Clientes que más compran{statsCategoria!=="todas" && <span className="text-carbon-500 font-sans font-normal"> — {statsCategoria}</span>}</h3>
                  {topClientes.length===0 && <p className="text-carbon-500 text-sm">Todavía no hay pedidos confirmados.</p>}
                  <div className="space-y-3">
                    {topClientes.map((c,i)=>(
                      <div key={i}>
                        <div className="flex justify-between text-xs font-semibold mb-1.5 text-carbon-200"><span>{c.nombre} ({c.pedidos} pedidos)</span><span className="text-ambar-400">{fmt(c.total)}</span></div>
                        <div className="bg-white/5 rounded-full h-2"><div className="bg-gradient-to-r from-ambar-500 to-ambar-300 h-2 rounded-full" style={{width:(c.total/maxCli*100)+"%"}}></div></div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            );
          })()}

          {adminTab==="configuracion" && (
            <ConfiguracionForm config={config} onGuardar={guardarConfig} />
          )}
        </ModalAdmin>
      )}

      {editando && (
        <ModalCentrado onClose={()=>setEditando(null)} titulo={editando==="nuevo"||editando.nuevo ? "Nuevo producto":"Editar producto"} icono="fa-box">
          <ProductForm producto={editando==="nuevo"?null:editando} categoriasLista={categoriasLista} onGuardar={guardarProducto} />
        </ModalCentrado>
      )}

      {editandoCliente && (
        <ModalCentrado onClose={()=>setEditandoCliente(null)} titulo={editandoCliente==="nuevo"?"Nuevo cliente":"Editar cliente"} icono="fa-user">
          <ClienteForm cliente={editandoCliente==="nuevo"?null:editandoCliente} onGuardar={guardarCliente} />
        </ModalCentrado>
      )}

      {editandoCombo && (
        <ModalCentrado onClose={()=>setEditandoCombo(null)} titulo={editandoCombo==="nuevo"?"Nuevo combo":"Editar combo"} icono="fa-gift">
          <ComboForm combo={editandoCombo==="nuevo"?null:editandoCombo} productos={productos} onGuardar={guardarCombo} />
        </ModalCentrado>
      )}

      {escanerAbierto && (
        <ModalCentrado onClose={()=>setEscanerAbierto(false)} titulo="Escanear código de barras" icono="fa-barcode">
          <ScannerModal onScan={onCodigoEscaneado} />
        </ModalCentrado>
      )}

      {productoEscaneado && (
        <ModalCentrado onClose={()=>setProductoEscaneado(null)} titulo={productoEscaneado.nuevo?"Código no encontrado":"Producto encontrado"} icono="fa-barcode">
          <div className="p-6">
            {productoEscaneado.nuevo ? (
              <>
                <p className="text-sm mb-4 text-carbon-300">El código <b className="text-ambar-400">{productoEscaneado.codigoBarras}</b> no corresponde a ningún producto cargado.</p>
                <button onClick={()=>{ setEditando({codigoBarras:productoEscaneado.codigoBarras, nombre:"", categoria:"General", imagen:"", precioMinorista:"", precioMayorista:"", cantMinMayorista:"", stock:""}); setProductoEscaneado(null); }}
                  className="w-full bg-gradient-to-br from-marca-400 to-marca-600 shadow-glow-marca hover:brightness-110 text-white py-3 rounded-xl text-sm font-bold transition">Cargar como producto nuevo</button>
              </>
            ) : (()=>{
              const prod = productos.find(p=>p.id===productoEscaneado.id) || productoEscaneado;
              return (
                <>
                  {prod.imagen ? <img src={prod.imagen} className="w-full aspect-video object-cover rounded-xl mb-4" /> : null}
                  <h4 className="font-heading text-base mb-1">{prod.nombre}</h4>
                  <p className="text-xs text-carbon-500 mb-1">Código: {prod.codigoBarras}</p>
                  <p className="text-sm text-ambar-400 font-heading mb-5">{fmt(prod.precioMinorista)} <span className="text-carbon-500 text-xs font-sans">minorista</span></p>

                  <p className="text-[11px] font-bold text-carbon-400 tracking-wide mb-2 text-center">STOCK ACTUAL</p>
                  <div className="flex items-center gap-4 justify-center mb-3">
                    <button onClick={()=>ajustarStock(prod.id,-1)} className="w-12 h-12 rounded-xl bg-white/10 hover:bg-white/20 font-bold text-lg active:scale-90 transition">-</button>
                    <input type="number" value={prod.stock ?? 0} onChange={e=>fijarStock(prod.id, e.target.value)}
                      className="input-oscuro font-heading text-2xl w-20 text-center text-ambar-400 rounded-xl py-2" />
                    <button onClick={()=>ajustarStock(prod.id,1)} className="w-12 h-12 rounded-xl bg-gradient-to-br from-marca-400 to-marca-600 font-bold text-lg active:scale-90 transition">+</button>
                  </div>
                  <p className="text-center text-xs text-carbon-500 mb-5">unidades — podés escribir el número exacto o usar +/-</p>

                  <button onClick={()=>{ setEditando(prod); setProductoEscaneado(null); }}
                    className="w-full bg-white/5 border border-carbon-700 text-carbon-200 py-3 rounded-xl text-sm font-bold hover:bg-white/10 transition"><i className="fa-solid fa-pen mr-1.5"></i>Editar producto completo</button>
                </>
              );
            })()}
          </div>
        </ModalCentrado>
      )}

      {adminHistorialCliente && (
        <DrawerDerecha onClose={()=>setAdminHistorialCliente(null)} titulo={"Historial — "+(adminHistorialCliente.nombre||adminHistorialCliente.numero)}>
          <div className="flex-1 overflow-y-auto p-4 space-y-3">
            {pedidos.filter(p=>p.clienteId===adminHistorialCliente.id).length===0 && <p className="text-carbon-500 text-sm text-center py-8">Este cliente todavía no hizo pedidos.</p>}
            {pedidos.filter(p=>p.clienteId===adminHistorialCliente.id).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha)).map(p=>(
              <PedidoResumen key={p.id} p={p} />
            ))}
          </div>
        </DrawerDerecha>
      )}
    </div>
  );
}

/* ============ COMPONENTES ============ */

function ModalCentrado({onClose,titulo,icono,children}){
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
      <div className="absolute inset-0 bg-black/70 backdrop-blur-sm animate-fade-in" onClick={onClose}></div>
      <div className="relative cristal border border-carbon-700 w-full sm:max-w-md rounded-3xl shadow-2xl overflow-hidden max-h-[90vh] overflow-y-auto animate-slide-up">
        <div className="sticky top-0 cristal-header px-5 py-4 flex justify-between items-center border-b border-carbon-700 z-10">
          <h3 className="font-heading text-sm text-ambar-300">{icono && <i className={"fa-solid "+icono+" mr-2"}></i>}{titulo}</h3>
          <button onClick={onClose} className="w-8 h-8 rounded-full hover:bg-white/10 flex items-center justify-center transition"><i className="fa-solid fa-xmark text-lg"></i></button>
        </div>
        {children}
      </div>
    </div>
  );
}

function DrawerDerecha({onClose,titulo,icono,children}){
  return (
    <div className="fixed inset-0 z-50 flex justify-end">
      <div className="absolute inset-0 bg-black/65 backdrop-blur-sm animate-fade-in" onClick={onClose}></div>
      <div className="relative w-full max-w-md cristal border-l border-carbon-700 h-full shadow-2xl flex flex-col animate-slide-up">
        <div className="p-5 cristal-header flex justify-between items-center border-b border-carbon-700 flex-shrink-0">
          <h2 className="font-heading text-base text-ambar-300">{icono && <i className={"fa-solid "+icono+" mr-2"}></i>}{titulo}</h2>
          <button onClick={onClose} className="w-8 h-8 rounded-full hover:bg-white/10 flex items-center justify-center transition"><i className="fa-solid fa-xmark text-lg"></i></button>
        </div>
        {children}
      </div>
    </div>
  );
}

function ModalAdmin({adminLogged,onClose,onSalir,userInput,setUserInput,passInput,setPassInput,loginAdminError,intentarLoginAdmin,adminTab,setAdminTab,pedidosNuevos,children}){
  const TABS = [["productos","Productos"],["categorias","Categorías"],["combos","Combos"],["clientes","Clientes"],["pedidos","Pedidos"],["stock","Actualizar Stock"],["estadisticas","Estadísticas"],["configuracion","Configuración"]];
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-6">
      <div className="absolute inset-0 bg-black/80 backdrop-blur-sm animate-fade-in" onClick={onClose}></div>
      <div className="relative cristal border border-carbon-700 w-full sm:max-w-3xl rounded-3xl shadow-2xl overflow-hidden max-h-[94vh] flex flex-col animate-slide-up">
        <div className="sticky top-0 cristal-header px-5 py-4 flex justify-between items-center border-b border-carbon-700 flex-shrink-0">
          <h3 className="font-heading text-sm text-ambar-300"><i className="fa-solid fa-lock mr-2"></i>{adminLogged?"Administración GOLO-MAS":"Ingresar"}</h3>
          <button onClick={onClose} className="w-8 h-8 rounded-full hover:bg-white/10 flex items-center justify-center transition"><i className="fa-solid fa-xmark text-lg"></i></button>
        </div>
        {!adminLogged ? (
          <div className="p-6 space-y-3.5">
            <input value={userInput} onChange={e=>setUserInput(e.target.value)} placeholder="Usuario" className="input-oscuro w-full rounded-xl p-3 text-sm" />
            <input value={passInput} onChange={e=>setPassInput(e.target.value)} type="password" placeholder="Contraseña" onKeyDown={e=>e.key==="Enter"&&intentarLoginAdmin()} className="input-oscuro w-full rounded-xl p-3 text-sm" />
            {loginAdminError && <p className="text-marca-400 text-xs font-semibold">{loginAdminError}</p>}
            <button onClick={intentarLoginAdmin} className="w-full bg-gradient-to-br from-marca-400 to-marca-600 shadow-glow-marca hover:brightness-110 active:scale-[.98] text-white py-3 rounded-xl text-sm font-bold transition">Entrar</button>
          </div>
        ) : (
          <>
            <div className="flex gap-1.5 px-4 pt-3.5 pb-3 overflow-x-auto no-scrollbar flex-shrink-0 border-b border-carbon-700">
              {TABS.map(([id,label])=>(
                <button key={id} onClick={()=>setAdminTab(id)} className={`flex-shrink-0 px-4 py-2 rounded-full text-xs font-bold transition-all ${adminTab===id?'bg-gradient-to-br from-ambar-300 to-ambar-500 text-carbon-900 shadow-glow-ambar':'bg-white/5 text-carbon-300 border border-carbon-700'}`}>
                  {label}{id==="pedidos" && pedidosNuevos>0 && ` (${pedidosNuevos})`}
                </button>
              ))}
              <button onClick={onSalir} className="ml-auto flex-shrink-0 px-4 py-2 rounded-full text-xs font-bold bg-marca-600 text-white active:scale-95 transition">Salir</button>
            </div>
            <div className="p-4 overflow-y-auto flex-1">{children}</div>
          </>
        )}
      </div>
    </div>
  );
}

function ProductCard({p,modoPrecio,precioProducto,agregarAlCarrito,clienteInfo,toggleFavorito,cantidadEnCarrito}){
  const [cant,setCant] = useState(1);
  const agotado = (p.stock!==undefined && p.stock!=="" && Number(p.stock)<=0) || p.agotado;
  const cantidadTotalPrevista = cant + (cantidadEnCarrito||0);
  const precio = precioProducto(p,cantidadTotalPrevista,modoPrecio);
  const enMayorista = modoPrecio==="mayorista" || (p.cantMinMayorista && p.precioMayorista && cantidadTotalPrevista >= Number(p.cantMinMayorista));
  const otroPrecio = modoPrecio==="minorista" ? p.precioMayorista : p.precioMinorista;
  const esFavorito = clienteInfo && (clienteInfo.favoritos||[]).includes(p.id);
  return (
    <div className="tarjeta-prod group relative rounded-2xl overflow-hidden flex flex-col animate-fade-in">
      {p.imagen ? <img src={p.imagen} onError={e=>{e.target.onerror=null;e.target.src=IMG_FALLBACK;}} className="w-full aspect-square object-cover transition-transform duration-500 ease-out group-hover:scale-105" /> : (
        <div className="w-full aspect-square bg-white/5 flex items-center justify-center text-carbon-600"><i className="fa-solid fa-box text-2xl"></i></div>
      )}
      {p.destacado && <span className="absolute top-2 left-2 bg-gradient-to-br from-ambar-300 to-ambar-500 text-carbon-900 text-[9px] font-bold uppercase px-2 py-1 rounded-full shadow-glow-ambar"><i className="fa-solid fa-star mr-1"></i>Destacado</span>}
      {clienteInfo && (
        <button onClick={()=>toggleFavorito(p.id)} className="absolute top-2 right-2 w-8 h-8 rounded-full bg-carbon-900/60 backdrop-blur flex items-center justify-center transition active:scale-90">
          <i className={`fa-${esFavorito?'solid':'regular'} fa-heart ${esFavorito?'text-marca-500':'text-white'}`}></i>
        </button>
      )}
      {agotado && (
        <div className="absolute inset-0 bg-carbon-900/85 backdrop-blur-[2px] flex items-center justify-center">
          <span className="font-heading text-xs text-marca-400 uppercase border border-marca-500/40 px-3 py-1 rounded-full">Sin stock</span>
        </div>
      )}
      <div className="p-3 flex flex-col gap-1.5 flex-1">
        <span className="text-[9px] uppercase tracking-[0.1em] font-bold text-ambar-400/90 bg-ambar-400/10 self-start px-2 py-0.5 rounded-full">{p.categoria||"General"}</span>
        <p className="text-[13px] font-bold leading-tight min-h-[32px] text-carbon-50">{p.nombre}</p>
        <div className="mt-auto">
          <p className="font-price text-ambar-400 text-xl leading-none">{fmt(precio)}</p>
          {enMayorista && p.precioMayorista ? (
            <p className="text-[10px] text-emerald-400 font-bold mt-1.5"><i className="fa-solid fa-circle-check mr-1"></i>Precio mayorista aplicado</p>
          ) : (p.cantMinMayorista && p.precioMayorista && modoPrecio!=="mayorista") ? (
            <p className="text-[10px] text-carbon-400 mt-1.5">Mayor: {fmt(p.precioMayorista)} desde {p.cantMinMayorista}u ({Number(p.cantMinMayorista)-cantidadTotalPrevista} más para llegar)</p>
          ) : (otroPrecio ? <p className="text-[10px] text-carbon-400 mt-1.5">{modoPrecio==="minorista"?"Mayor":"Menor"}: {fmt(otroPrecio)}</p> : null)}
        </div>
        <div className="flex items-center gap-1.5 mt-2">
          <div className="flex items-center bg-white/5 border border-carbon-700 rounded-lg overflow-hidden flex-shrink-0">
            <button onClick={()=>setCant(c=>Math.max(1,c-1))} className="w-6 h-7 text-xs font-bold active:scale-90 transition">-</button>
            <input value={cant} onChange={e=>setCant(Math.max(1,Number(e.target.value)||1))} className="w-7 text-center text-xs font-bold bg-transparent" />
            <button onClick={()=>setCant(c=>c+1)} className="w-6 h-7 text-xs font-bold active:scale-90 transition">+</button>
          </div>
          <button disabled={agotado} onClick={()=>agregarAlCarrito(p,cant)} className="flex-1 bg-gradient-to-br from-marca-400 to-marca-600 disabled:opacity-30 disabled:shadow-none text-white rounded-lg text-[11px] font-bold py-2 shadow-glow-marca active:scale-95 transition">Agregar</button>
        </div>
      </div>
    </div>
  );
}

function ProductoAdminCard({p,seleccionado,toggleSeleccion,onEditar,onBorrar}){
  return (
    <div className={`relative rounded-xl border overflow-hidden bg-white/[.03] ${seleccionado?'border-ambar-400 ring-2 ring-ambar-400/40':'border-carbon-700'}`}>
      <input type="checkbox" checked={seleccionado} onChange={()=>toggleSeleccion(p.id)} className="absolute top-1.5 left-1.5 w-4 h-4 z-10 accent-ambar-500" />
      {p.imagen ? <img src={p.imagen} onError={e=>{e.target.onerror=null;e.target.src=IMG_FALLBACK;}} className="w-full aspect-square object-cover" /> : <div className="w-full aspect-square bg-white/5 flex items-center justify-center text-carbon-600 text-xs">Sin foto</div>}
      <div className="p-2.5">
        <p className="text-[12px] font-bold truncate text-carbon-100">{p.nombre}</p>
        <p className="text-[11px] text-ambar-400 font-bold">{fmt(p.precioMinorista)}</p>
        <div className="flex gap-1 mt-2">
          <button onClick={onEditar} className="flex-1 bg-white/5 border border-carbon-700 rounded-lg text-[10px] font-bold py-1.5">Editar</button>
          <button onClick={onBorrar} className="flex-1 bg-marca-600 text-white rounded-lg text-[10px] font-bold py-1.5">Borrar</button>
        </div>
      </div>
    </div>
  );
}

function PedidoResumen({p}){
  const ETAPAS = ["recibido","en proceso","en proceso de entrega","entregado"];
  const idxActual = ETAPAS.indexOf(p.estado);
  return (
    <div className="bg-white/[.03] border border-carbon-700 rounded-xl p-3.5">
      <div className="flex justify-between items-center mb-3">
        <span className="text-xs font-bold text-carbon-400">{new Date(p.fecha).toLocaleDateString("es-AR")}</span>
        <span className="font-heading text-sm text-ambar-400">{fmt(p.total)}</span>
      </div>
      <div className="flex items-center mb-3">
        {ETAPAS.map((et,i)=>(
          <React.Fragment key={et}>
            <div className="flex flex-col items-center gap-1">
              <div className={`w-5 h-5 rounded-full flex items-center justify-center text-[9px] font-bold ${i<=idxActual?'bg-gradient-to-br from-marca-400 to-marca-600 text-white':'bg-white/10 text-carbon-500'}`}>
                {i<idxActual ? <i className="fa-solid fa-check text-[8px]"></i> : i+1}
              </div>
              <span className={`text-[8.5px] text-center leading-tight capitalize w-14 ${i<=idxActual?'text-carbon-200 font-semibold':'text-carbon-600'}`}>{et}</span>
            </div>
            {i<ETAPAS.length-1 && <div className={`flex-1 h-0.5 mb-4 ${i<idxActual?'bg-marca-500':'bg-white/10'}`}></div>}
          </React.Fragment>
        ))}
      </div>
      {(p.items||[]).map((it,i)=><p key={i} className="text-xs text-carbon-400">{it.cantidad}x {it.nombre} — {fmt(it.subtotal)}</p>)}
    </div>
  );
}

function ProductForm({producto,categoriasLista,onGuardar}){
  const [form,setForm] = useState(producto || {nombre:"",categoria:categoriasLista[0]?.nombre||"",imagen:"",precioMinorista:"",precioMayorista:"",cantMinMayorista:"",codigoBarras:"",stock:"",agotado:false,destacado:false});
  const [escaneando,setEscaneando] = useState(false);
  const [imgError,setImgError] = useState(false);
  const [buscandoOFF,setBuscandoOFF] = useState(false);
  const [offMensaje,setOffMensaje] = useState("");
  const set = (k,v)=>{ if(k==="imagen") setImgError(false); setForm(f=>({...f,[k]:v})); };

  const buscarEnOpenFoodFacts = async (codigo) => {
    if(!codigo) return;
    setBuscandoOFF(true); setOffMensaje("");
    try{
      const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${codigo}.json`);
      const data = await res.json();
      if(data.status===1 && data.product){
        const nombreOFF = data.product.product_name_es || data.product.product_name || "";
        const imagenOFF = data.product.image_front_url || data.product.image_url || "";
        if(!nombreOFF && !imagenOFF){
          setOffMensaje("Se encontró el código, pero sin nombre ni foto cargados en la base. Completá a mano.");
        }else{
          setForm(f=>({...f, nombre: f.nombre || nombreOFF, imagen: imagenOFF || f.imagen}));
          if(imagenOFF) setImgError(false);
          setOffMensaje("✓ Encontrado en la base pública — se completaron nombre y/o foto.");
        }
      } else {
        setOffMensaje("No se encontró este código en la base pública. Cargá los datos a mano.");
      }
    }catch(e){
      setOffMensaje("No se pudo consultar la base pública (revisá tu conexión).");
    }
    setBuscandoOFF(false);
  };
  return (
    <div className="p-6 space-y-3.5">
      <Campo label="Nombre"><input value={form.nombre} onChange={e=>set("nombre",e.target.value)} className="input-oscuro w-full rounded-xl p-3 text-sm" /></Campo>
      <Campo label="Categoría">
        {categoriasLista.length===0 ? (
          <p className="text-[11px] text-marca-400">Todavía no cargaste categorías. Andá a la pestaña "Categorías" y agregá al menos una.</p>
        ) : (
          <select value={form.categoria} onChange={e=>set("categoria",e.target.value)} className="input-oscuro w-full rounded-xl p-3 text-sm">
            {categoriasLista.map(c=><option key={c.id} value={c.nombre} className="bg-carbon-850">{c.nombre}</option>)}
          </select>
        )}
      </Campo>
      {escaneando && (
        <ModalCentrado onClose={()=>setEscaneando(false)} titulo="Escanear código de barras" icono="fa-barcode">
          <ScannerModal onScan={(codigo)=>{ set("codigoBarras",codigo); setEscaneando(false); buscarEnOpenFoodFacts(codigo); }} />
        </ModalCentrado>
      )}
      <Campo label="URL de imagen">
        <input value={form.imagen} onChange={e=>set("imagen",e.target.value)} placeholder="https://... o link de Google Drive" className="input-oscuro w-full rounded-xl p-3 text-sm" />
        {form.imagen && (
          <div className="mt-2 flex items-center gap-3">
            <div className="w-16 h-16 rounded-lg overflow-hidden bg-white/5 border border-carbon-700 flex-shrink-0 flex items-center justify-center">
              {!imgError ? (
                <img src={normalizarUrlImagen(form.imagen)} onError={()=>setImgError(true)} onLoad={()=>setImgError(false)} className="w-full h-full object-cover" />
              ) : <i className="fa-solid fa-image-slash text-carbon-500"></i>}
            </div>
            {imgError ? (
              <p className="text-[11px] text-marca-400">No se pudo cargar esta imagen. Probá con otro link (asegurate que sea un link directo a la imagen, no a una página).</p>
            ) : (
              <p className="text-[11px] text-emerald-400"><i className="fa-solid fa-check mr-1"></i>La imagen carga correctamente.</p>
            )}
          </div>
        )}
      </Campo>
      <Campo label="Código de barras">
        <div className="flex gap-2">
          <input value={form.codigoBarras||""} onChange={e=>set("codigoBarras",e.target.value)} className="input-oscuro flex-1 rounded-xl p-3 text-sm" />
          <button type="button" onClick={()=>setEscaneando(true)} className="bg-gradient-to-br from-marca-400 to-marca-600 text-white px-4 rounded-xl text-sm flex-shrink-0 active:scale-95 transition"><i className="fa-solid fa-barcode"></i></button>
          <button type="button" disabled={buscandoOFF || !form.codigoBarras} onClick={()=>buscarEnOpenFoodFacts(form.codigoBarras)} className="bg-white/5 border border-carbon-700 text-carbon-200 px-4 rounded-xl text-sm flex-shrink-0 disabled:opacity-30 active:scale-95 transition" title="Buscar nombre y foto por código">
            {buscandoOFF ? <i className="fa-solid fa-spinner fa-spin"></i> : <i className="fa-solid fa-magnifying-glass"></i>}
          </button>
        </div>
        {offMensaje && <p className={`text-[11px] mt-1.5 ${offMensaje.startsWith("✓")?'text-emerald-400':'text-carbon-400'}`}>{offMensaje}</p>}
        <p className="text-[10.5px] text-carbon-500 mt-1">La lupa busca el nombre y la foto en una base pública (Open Food Facts) a partir del código de barras real.</p>
      </Campo>
      <div className="grid grid-cols-2 gap-3">
        <Campo label="Precio minorista ($)"><input type="number" value={form.precioMinorista} onChange={e=>set("precioMinorista",e.target.value)} className="input-oscuro w-full rounded-xl p-3 text-sm" /></Campo>
        <Campo label="Precio mayorista ($)"><input type="number" value={form.precioMayorista} onChange={e=>set("precioMayorista",e.target.value)} className="input-oscuro w-full rounded-xl p-3 text-sm" /></Campo>
      </div>
      <div className="grid grid-cols-2 gap-3">
        <Campo label="Cant. mínima mayorista"><input type="number" value={form.cantMinMayorista} onChange={e=>set("cantMinMayorista",e.target.value)} placeholder="ej: 6" className="input-oscuro w-full rounded-xl p-3 text-sm" /></Campo>
        <Campo label="Stock"><input type="number" value={form.stock} onChange={e=>set("stock",e.target.value)} className="input-oscuro w-full rounded-xl p-3 text-sm" /></Campo>
      </div>
      <div className="flex gap-5">
        <label className="flex items-center gap-2 text-xs font-semibold text-carbon-300"><input type="checkbox" checked={!!form.agotado} onChange={e=>set("agotado",e.target.checked)} className="accent-ambar-500" />Marcar como sin stock</label>
        <label className="flex items-center gap-2 text-xs font-semibold text-carbon-300"><input type="checkbox" checked={!!form.destacado} onChange={e=>set("destacado",e.target.checked)} className="accent-ambar-500" />Destacado de la semana</label>
      </div>
      <button onClick={()=>onGuardar(form)} className="w-full bg-gradient-to-br from-marca-400 to-marca-600 shadow-glow-marca hover:brightness-110 active:scale-[.98] text-white py-3 rounded-xl text-sm font-bold transition">Guardar</button>
    </div>
  );
}

function Campo({label,children}){

}

function ScannerModal({onScan}){
  const [error,setError] = useState("");
  const [buscando,setBuscando] = useState(true);
  const qrRef = useRef(null);
  const detenidoRef = useRef(false);

  const detenerYLimpiar = () => {
    if(!qrRef.current || detenidoRef.current) return Promise.resolve();
    detenidoRef.current = true;
    return qrRef.current.stop()
      .catch(()=>{})
      .then(()=>{ try{ qrRef.current.clear(); }catch(e){} });
  };

  useEffect(()=>{
    let activo = true;
    if(!window.Html5Qrcode){
      setError("La librería de escaneo no cargó. Revisá tu conexión a internet y volvé a intentar.");
      return;
    }
    if(location.protocol !== "https:" && location.hostname !== "localhost"){
      setError("La cámara solo funciona en el sitio publicado (https). Probá desde el link de Vercel, no abriendo el archivo directo.");
      return;
    }
    try{
      const html5Qr = new Html5Qrcode("reader");
      qrRef.current = html5Qr;
      html5Qr.start(
        {facingMode:"environment"},
        {fps:10, qrbox:{width:250,height:150}},
        (decodedText)=>{
          if(!activo) return;
          activo = false;
          detenerYLimpiar().then(()=>{ onScan(decodedText); });
        },
        ()=>{}
      ).then(()=>setBuscando(false)).catch(()=>{
        setError("No se pudo acceder a la cámara. Revisá los permisos del navegador o usá la carga manual.");
      });
    }catch(e){
      setError("El navegador no permite usar la cámara acá. Usá la carga manual.");
    }
    return ()=>{ activo=false; detenerYLimpiar(); };
  },[]);

  return (
    <div className="p-6">
      <div id="reader" className="border border-carbon-700"></div>
      {error && <p className="text-marca-400 text-xs mt-3 font-semibold">{error}</p>}
      {!error && <p className="text-[11px] text-carbon-500 mt-3">Apuntá con la cámara al código de barras del producto.</p>}
    </div>
  );
}

class ErrorBoundary extends React.Component{
  constructor(props){ super(props); this.state = {error:null}; }
  static getDerivedStateFromError(error){ return {error}; }
  render(){
    if(this.state.error){
      return (
        <div className="min-h-screen flex items-center justify-center p-6 text-center">
          <div>
            <i className="fa-solid fa-triangle-exclamation text-4xl text-marca-500 mb-4"></i>
            <p className="font-heading text-lg mb-2">Uy, algo se rompió</p>
            <p className="text-carbon-400 text-sm mb-5">Probá recargar la página. Si vuelve a pasar, avisale a Matías.</p>
            <button onClick={()=>window.location.reload()} className="bg-gradient-to-br from-marca-400 to-marca-600 shadow-glow-marca text-white px-6 py-3 rounded-xl text-sm font-bold">Recargar</button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App/></ErrorBoundary>);
