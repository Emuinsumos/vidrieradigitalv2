<script type="text/babel">
const { useState, useEffect, useRef } = React;
const NOMBRE_NEGOCIO = "El Argentino";
const TAGLINE = "Café · Desayuno · Almuerzo · Parrilla";

// Credenciales de admin — cambiar acá cuando quieras
const ADMIN_USUARIO = "demo";
const ADMIN_CONTRASENA = "demo";

function resizeImagen(file, callback, maxSize = 900) {
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;
      if (width > height && width > maxSize) { height *= maxSize / width; width = maxSize; }
      else if (height > maxSize) { width *= maxSize / height; height = maxSize; }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      callback(canvas.toDataURL('image/jpeg', 0.82));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function App() {
  const [productos, setProductos] = useState({});
  const [categorias, setCategorias] = useState([]);
  const [config, setConfig] = useState({ whatsapp: '', instagram: '', logo: '', direccion: '' });

  const [categoriaActiva, setCategoriaActiva] = useState('todas');
  const [busqueda, setBusqueda] = useState('');

  const [isAdmin, setIsAdmin] = useState(false);
  const [mostrarAdminModal, setMostrarAdminModal] = useState(false);
  const [adminTab, setAdminTab] = useState('pedidos');
  const [usuario, setUsuario] = useState('');
  const [contrasena, setContrasena] = useState('');
  const [errorLogin, setErrorLogin] = useState('');

  const [form, setForm] = useState({ nombre: '', categoria: '', descripcion: '', precio: '', imagen: '', insumos: [] });
  const [editandoId, setEditandoId] = useState(null);

  const [nuevaCategoria, setNuevaCategoria] = useState('');

  const [whatsappInput, setWhatsappInput] = useState('');
  const [instagramInput, setInstagramInput] = useState('');
  const [direccionInput, setDireccionInput] = useState('');

  const [platoDelDia, setPlatoDelDia] = useState(null);
  const [platoForm, setPlatoForm] = useState({ nombre: '', descripcion: '', precio: '', imagen: '', insumos: [] });

  const [carrito, setCarrito] = useState([]);
  const [mostrarCarrito, setMostrarCarrito] = useState(false);
  const [modoConsumo, setModoConsumo] = useState('mesa');
  const [pedidoForm, setPedidoForm] = useState({ nombre: '', telefono: '', direccion: '', mesa: '' });
  const [enviandoPedido, setEnviandoPedido] = useState(false);

  const [mesas, setMesas] = useState({});
  const [nuevaMesaNumero, setNuevaMesaNumero] = useState('');
  const [mesaPorQR, setMesaPorQR] = useState(null);

  const [pedidos, setPedidos] = useState({});
  const [confirmacionPedido, setConfirmacionPedido] = useState(null);

  const [insumos, setInsumos] = useState({});
  const [insumoForm, setInsumoForm] = useState({ nombre: '', unidad: '', cantidad: '', minimo: '' });
  const [editandoInsumoId, setEditandoInsumoId] = useState(null);
  const [selInsumoProd, setSelInsumoProd] = useState('');
  const [cantInsumoProd, setCantInsumoProd] = useState('');
  const [selInsumoPlato, setSelInsumoPlato] = useState('');
  const [cantInsumoPlato, setCantInsumoPlato] = useState('');

  const [chatbotConfig, setChatbotConfig] = useState({ saludo: '', preguntas: {} });
  const [chatSaludoInput, setChatSaludoInput] = useState('');
  const [mostrarChat, setMostrarChat] = useState(false);
  const [preguntaActiva, setPreguntaActiva] = useState(null);
  const [preguntaForm, setPreguntaForm] = useState({ pregunta: '', respuesta: '' });
  const [editandoPreguntaId, setEditandoPreguntaId] = useState(null);

  const [combos, setCombos] = useState({});
  const [comboForm, setComboForm] = useState({ nombre: '', descripcion: '', precio: '', imagen: '', insumos: [] });
  const [editandoComboId, setEditandoComboId] = useState(null);
  const [selInsumoCombo, setSelInsumoCombo] = useState('');
  const [cantInsumoCombo, setCantInsumoCombo] = useState('');

  const [modoVistaCocina, setModoVistaCocina] = useState(false);

  function fechaISO(ts) {
    const d = new Date(ts || Date.now());
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }
  const [fechaCajaSeleccionada, setFechaCajaSeleccionada] = useState(fechaISO());

  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const mesaUrl = params.get('mesa');
    if (mesaUrl) {
      setMesaPorQR(mesaUrl);
      setModoConsumo('mesa');
      setPedidoForm(f => ({ ...f, mesa: mesaUrl }));
    }
    if (params.get('cocina')) setModoVistaCocina(true);
  }, []);

  useEffect(() => {
    db.ref('productos').on('value', s => setProductos(s.val() || {}));
    db.ref('categorias').on('value', s => setCategorias(s.val() || []));
    db.ref('config').on('value', s => {
      const c = s.val() || {};
      setConfig(c);
      setWhatsappInput(c.whatsapp || '');
      setInstagramInput(c.instagram || '');
      setDireccionInput(c.direccion || '');
    });
    db.ref('platoDelDia').on('value', s => {
      const p = s.val();
      setPlatoDelDia(p);
      if (p) setPlatoForm({ nombre: p.nombre || '', descripcion: p.descripcion || '', precio: p.precio ? String(p.precio) : '', imagen: p.imagen || '', insumos: p.insumos || [] });
    });
    db.ref('mesas').on('value', s => setMesas(s.val() || {}));
    db.ref('pedidos').on('value', s => setPedidos(s.val() || {}));
    db.ref('insumos').on('value', s => setInsumos(s.val() || {}));
    db.ref('chatbot').on('value', s => {
      const c = s.val() || { saludo: '', preguntas: {} };
      setChatbotConfig(c);
      setChatSaludoInput(c.saludo || '');
    });
    db.ref('combos').on('value', s => setCombos(s.val() || {}));
  }, []);

  const listaProductos = Object.entries(productos).map(([id, p]) => ({ id, ...p }));

  const productosFiltrados = listaProductos.filter(p => {
    const pasaCategoria = categoriaActiva === 'todas' || p.categoria === categoriaActiva;
    const pasaBusqueda = !busqueda || p.nombre.toLowerCase().includes(busqueda.toLowerCase());
    return pasaCategoria && pasaBusqueda;
  });

  const categoriasConProductos = categorias.filter(c => listaProductos.some(p => p.categoria === c));

  function intentarLogin() {
    if (usuario === ADMIN_USUARIO && contrasena === ADMIN_CONTRASENA) {
      setIsAdmin(true);
      setErrorLogin('');
      setUsuario(''); setContrasena('');
    } else {
      setErrorLogin('Usuario o contraseña incorrectos');
    }
  }
  function cerrarSesion() {
    setIsAdmin(false);
    setMostrarAdminModal(false);
  }

  function resetForm() {
    setForm({ nombre: '', categoria: categorias[0] || '', descripcion: '', precio: '', imagen: '', insumos: [] });
    setEditandoId(null);
    setSelInsumoProd(''); setCantInsumoProd('');
  }
  function editarProducto(p) {
    setForm({ nombre: p.nombre, categoria: p.categoria, descripcion: p.descripcion || '', precio: String(p.precio), imagen: p.imagen || '', insumos: p.insumos || [] });
    setEditandoId(p.id);
    setAdminTab('productos');
  }
  function guardarProducto() {
    if (!form.nombre || !form.categoria || !form.precio) return;
    const id = editandoId || db.ref('productos').push().key;
    db.ref('productos/' + id).set({
      nombre: form.nombre,
      categoria: form.categoria,
      descripcion: form.descripcion || '',
      precio: Number(form.precio),
      imagen: form.imagen || '',
      insumos: form.insumos || []
    });
    resetForm();
  }
  function eliminarProducto(id) {
    if (confirm('¿Eliminar este ítem del menú?')) db.ref('productos/' + id).remove();
  }
  function handleImagenProducto(e) {
    const file = e.target.files[0];
    if (!file) return;
    resizeImagen(file, dataUrl => setForm(f => ({ ...f, imagen: dataUrl })));
    e.target.value = '';
  }
  function agregarInsumoAProducto() {
    if (!selInsumoProd || !cantInsumoProd) return;
    setForm(f => ({ ...f, insumos: [...(f.insumos || []), { insumoId: selInsumoProd, cantidad: Number(cantInsumoProd) }] }));
    setSelInsumoProd(''); setCantInsumoProd('');
  }
  function quitarInsumoDeProducto(idx) {
    setForm(f => ({ ...f, insumos: f.insumos.filter((_, i) => i !== idx) }));
  }

  function agregarCategoria() {
    if (!nuevaCategoria || categorias.includes(nuevaCategoria)) return;
    db.ref('categorias').set([...categorias, nuevaCategoria]).then(() => setNuevaCategoria(''));
  }
  function eliminarCategoria(cat) {
    if (listaProductos.some(p => p.categoria === cat)) {
      alert('Esta categoría tiene ítems del menú cargados. Cambiá o eliminá esos ítems antes de borrarla.');
      return;
    }
    db.ref('categorias').set(categorias.filter(c => c !== cat));
  }

  function agregarAlCarrito(p) {
    setCarrito(prev => {
      const existe = prev.find(it => it.id === p.id);
      if (existe) return prev.map(it => it.id === p.id ? { ...it, cantidad: it.cantidad + 1 } : it);
      return [...prev, { id: p.id, nombre: p.nombre, precio: p.precio, cantidad: 1, insumos: p.insumos || [] }];
    });
  }
  function agregarPlatoDelDiaAlCarrito() {
    if (!platoDelDia) return;
    const idPlato = 'plato-del-dia';
    setCarrito(prev => {
      const existe = prev.find(it => it.id === idPlato);
      if (existe) return prev.map(it => it.id === idPlato ? { ...it, cantidad: it.cantidad + 1 } : it);
      return [...prev, { id: idPlato, nombre: platoDelDia.nombre, precio: platoDelDia.precio, cantidad: 1, insumos: platoDelDia.insumos || [] }];
    });
  }
  function agregarComboAlCarrito(c) {
    const cartId = 'combo-' + c.id;
    setCarrito(prev => {
      const existe = prev.find(it => it.id === cartId);
      if (existe) return prev.map(it => it.id === cartId ? { ...it, cantidad: it.cantidad + 1 } : it);
      return [...prev, { id: cartId, nombre: c.nombre, precio: c.precio, cantidad: 1, insumos: c.insumos || [] }];
    });
  }
  function cambiarCantidadCarrito(id, delta) {
    setCarrito(prev => prev
      .map(it => it.id === id ? { ...it, cantidad: it.cantidad + delta } : it)
      .filter(it => it.cantidad > 0));
  }
  const totalCarrito = carrito.reduce((a, it) => a + it.cantidad * it.precio, 0);
  const cantidadCarrito = carrito.reduce((a, it) => a + it.cantidad, 0);

  function puedeEnviarPedido() {
    if (carrito.length === 0) return false;
    if (modoConsumo === 'mesa') return !!pedidoForm.mesa;
    if (modoConsumo === 'delivery') return !!pedidoForm.nombre && !!pedidoForm.telefono && !!pedidoForm.direccion;
    return !!pedidoForm.nombre; // take away
  }

  function descontarStockPorPedido(items) {
    const updates = {};
    items.forEach(it => {
      (it.insumos || []).forEach(ins => {
        const totalUsado = ins.cantidad * it.cantidad;
        if (!totalUsado) return;
        updates['insumos/' + ins.insumoId + '/cantidad'] = firebase.database.ServerValue.increment(-totalUsado);
      });
    });
    if (Object.keys(updates).length > 0) db.ref().update(updates);
  }

  function enviarPedido() {
    if (!puedeEnviarPedido()) return;
    if (modoConsumo !== 'mesa' && !config.whatsapp) return;
    setEnviandoPedido(true);

    const pedidoData = {
      modo: modoConsumo,
      mesa: pedidoForm.mesa || null,
      nombre: pedidoForm.nombre || null,
      telefono: pedidoForm.telefono || null,
      direccion: pedidoForm.direccion || null,
      items: carrito,
      total: totalCarrito,
      estado: 'nuevo',
      creado: Date.now()
    };

    db.ref('pedidos').push().set(pedidoData).then(() => {
      descontarStockPorPedido(carrito);
      if (modoConsumo === 'mesa') {
        setConfirmacionPedido(`¡Pedido enviado a la Mesa ${pedidoForm.mesa}! Ya lo estamos preparando.`);
        setCarrito([]);
        setEnviandoPedido(false);
      } else {
        const lineas = [];
        lineas.push(`Nuevo pedido - ${NOMBRE_NEGOCIO}`);
        if (modoConsumo === 'takeaway') lineas.push(`Modo: Take away - ${pedidoForm.nombre}`);
        if (modoConsumo === 'delivery') {
          lineas.push(`Modo: Delivery`);
          lineas.push(`Cliente: ${pedidoForm.nombre}`);
          lineas.push(`Teléfono: ${pedidoForm.telefono}`);
          lineas.push(`Dirección: ${pedidoForm.direccion}`);
        }
        lineas.push('-------------------------');
        carrito.forEach(it => lineas.push(`${it.cantidad}x ${it.nombre} - $${it.cantidad * it.precio}`));
        lineas.push('-------------------------');
        lineas.push(`Total: $${totalCarrito}`);
        const mensaje = encodeURIComponent(lineas.join('\n'));
        window.open(`https://wa.me/${config.whatsapp}?text=${mensaje}`, '_blank');
        setCarrito([]);
        setPedidoForm({ nombre: '', telefono: '', direccion: '', mesa: mesaPorQR || '' });
        setMostrarCarrito(false);
        setEnviandoPedido(false);
      }
    }).catch(() => setEnviandoPedido(false));
  }
  function cerrarConfirmacionPedido() {
    setConfirmacionPedido(null);
    setPedidoForm({ nombre: '', telefono: '', direccion: '', mesa: mesaPorQR || '' });
    setMostrarCarrito(false);
  }

  const ESTADOS_PEDIDO = ['nuevo', 'recibido', 'entregado', 'cobrado'];
  const ESTADO_LABEL = { nuevo: 'Nuevo pedido', recibido: 'Recibido', entregado: 'Entregado', cobrado: 'Cobrado' };
  const ESTADO_ESTILO = {
    nuevo: 'bg-sky-100 text-sky-700',
    recibido: 'bg-bronce-200 text-cafe-800',
    entregado: 'bg-orange-100 text-orange-700',
    cobrado: 'bg-green-100 text-green-700'
  };
  const listaPedidos = Object.entries(pedidos).map(([id, p]) => ({ id, ...p })).sort((a,b) => (b.creado||0) - (a.creado||0));

  const pedidosCajaSel = listaPedidos.filter(p => fechaISO(p.creado) === fechaCajaSeleccionada);
  const cobradosCajaSel = pedidosCajaSel.filter(p => p.estado === 'cobrado');
  const abiertosCajaSel = pedidosCajaSel.filter(p => p.estado !== 'cobrado');
  const totalCajaSel = cobradosCajaSel.reduce((a, p) => a + (p.total || 0), 0);
  const totalPorCobrarSel = abiertosCajaSel.reduce((a, p) => a + (p.total || 0), 0);
  const desglosePorModoSel = { mesa: 0, takeaway: 0, delivery: 0 };
  cobradosCajaSel.forEach(p => { desglosePorModoSel[p.modo] = (desglosePorModoSel[p.modo] || 0) + (p.total || 0); });

  function etiquetaFecha(fechaStr) {
    if (fechaStr === fechaISO()) return 'Hoy';
    const [y, m, d] = fechaStr.split('-').map(Number);
    const fecha = new Date(y, m - 1, d);
    const texto = fecha.toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' });
    return texto.charAt(0).toUpperCase() + texto.slice(1);
  }

    listaPedidos.filter(p => p.estado === 'cobrado').forEach(p => {
      const f = fechaISO(p.creado);
      mapa[f] = (mapa[f] || 0) + (p.total || 0);
    });
    return Object.entries(mapa).map(([fecha, total]) => ({ fecha, total })).sort((a, b) => b.fecha.localeCompare(a.fecha)).slice(0, 14);
  })();

  const topProductos = (() => {
    const conteo = {};
    listaPedidos.filter(p => p.estado === 'cobrado').forEach(p => {
      (p.items || []).forEach(it => {
        if (!conteo[it.nombre]) conteo[it.nombre] = { nombre: it.nombre, cantidad: 0, total: 0 };
        conteo[it.nombre].cantidad += it.cantidad;
        conteo[it.nombre].total += it.cantidad * it.precio;
      });
    });
    return Object.values(conteo).sort((a, b) => b.cantidad - a.cantidad).slice(0, 10);

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
