<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

// ============ BASE DE DATOS DE LA DEMO (en memoria, sin Firebase) ============
// Imita lo que la app usa de Firebase: ref().on / push / update / remove.
// Los datos de ejemplo se cargan al abrir y los cambios se pierden al recargar.
const SIN_FOTO = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96"><rect width="96" height="96" fill="#1b2840"/><circle cx="48" cy="36" r="16" fill="#3a4a6b"/><path d="M14 96c3-24 17-34 34-34s31 10 34 34z" fill="#3a4a6b"/></svg>');

function sembrarDemo() {
  const dia = (off) => new Date(Date.now() + off * 864e5).toISOString().slice(0, 10);
  // [id, nombre, calidad, arquero, PJ, PG, PE, PP, goles, últimos 5 (el más nuevo primero)]
  const base = [
    ["j1", "Facu", 5, false, 8, 6, 1, 1, 9, ["V", "V", "E", "V", "V"]],
    ["j2", "Santi", 4, false, 8, 5, 2, 1, 6, ["V", "E", "V", "D", "V"]],
    ["j3", "Lauti", 4, false, 7, 4, 2, 1, 5, ["E", "V", "V", "V", "D"]],
    ["j4", "Gonza", 3, false, 8, 4, 1, 3, 4, ["D", "V", "V", "E", "V"]],
    ["j5", "Tobi", 3, false, 6, 3, 1, 2, 3, ["V", "D", "E", "V", "D"]],
    ["j6", "Joaco", 4, false, 8, 3, 3, 2, 2, ["E", "E", "V", "D", "V"]],
    ["j7", "Maxi", 2, false, 7, 2, 2, 3, 1, ["D", "V", "E", "D", "E"]],
    ["j8", "Ale", 3, false, 6, 2, 1, 3, 2, ["D", "D", "V", "E", "D"]],
    ["j9", "Bruno", 4, true, 8, 4, 2, 2, 0, ["V", "E", "D", "V", "E"]],
    ["j10", "Dami", 3, true, 7, 2, 2, 3, 0, ["D", "E", "V", "D", "D"]]
  ];
  const jugadores = {};
  base.forEach(([id, nombre, calidad, arquero, pj, pg, pe, pp, goles, ultimos]) => {
    const n = ultimos.length;
    const golesRecientes = Math.round(goles * n / pj);
    const reparto = ultimos.map(() => 0);
    for (let k = 0; k < golesRecientes; k++) reparto[(k * 2) % n]++;
    const historial = ultimos
      .map((resultado, i) => ({ fecha: dia(-7 * (i + 1)), resultado, goles: reparto[i] }))
      .reverse();
    jugadores[id] = {
      nombre, foto: "", calidad, arquero, pj, pg, pe, pp,
      puntos: pg * 3 + pe, goles, ultimos, historial
    };
  });

  const equipoA = ["j9", "j5", "j8", "j6", "j1"];
  const equipoB = ["j10", "j7", "j4", "j3", "j2"];
  const partidos = {
    p1: {
      fecha: dia(-7), disponibles: [...equipoA, ...equipoB],
      equipoA: ["j1", "j4", "j5", "j7", "j9"], equipoB: ["j2", "j3", "j6", "j8", "j10"],
      resultado: "A", finalizado: true
    },
    p2: {
      fecha: dia(3), disponibles: [...equipoA, ...equipoB], equipoA, equipoB,
      posiciones: {
        j9: { x: 50, y: 10 }, j5: { x: 30, y: 27 }, j8: { x: 70, y: 27 }, j6: { x: 35, y: 42 }, j1: { x: 65, y: 42 },
        j10: { x: 50, y: 90 }, j7: { x: 30, y: 73 }, j4: { x: 70, y: 73 }, j3: { x: 35, y: 58 }, j2: { x: 65, y: 58 }
      },
      manual: true, resultado: null, finalizado: false
    }
  };

  const ficha = (id, nombre, arquero, pj, pg, pe, pp, puntos, goles, promedio) =>
    ({ id, nombre, foto: "", arquero, pj, pg, pe, pp, puntos, goles, promedio });
  const temporadas = {
    t1: {
      nombre: "Temporada 1",
      cerradaEn: new Date(Date.now() - 60 * 864e5).toISOString(),
      tabla: [
        ficha("j2", "Santi", false, 10, 7, 2, 1, 23, 8, 2.3),
        ficha("j1", "Facu", false, 10, 6, 2, 2, 20, 12, 2.0),
        ficha("j9", "Bruno", true, 10, 5, 3, 2, 18, 0, 1.8),
        ficha("j3", "Lauti", false, 9, 4, 3, 2, 15, 4, 1.67),
        ficha("j4", "Gonza", false, 10, 4, 2, 4, 14, 5, 1.4)
      ],
      premios: [
        { tipo: "campeon", jugadorId: "j2", nombre: "Santi", foto: "" },
        { tipo: "goleador", jugadorId: "j1", nombre: "Facu", foto: "" },
        { tipo: "mejor_arquero", jugadorId: "j9", nombre: "Bruno", foto: "" },
        { tipo: "equipo_ideal", jugadorId: "j9", nombre: "Bruno", foto: "" },
        { tipo: "equipo_ideal", jugadorId: "j2", nombre: "Santi", foto: "" },
        { tipo: "equipo_ideal", jugadorId: "j1", nombre: "Facu", foto: "" },
        { tipo: "equipo_ideal", jugadorId: "j3", nombre: "Lauti", foto: "" },
        { tipo: "equipo_ideal", jugadorId: "j4", nombre: "Gonza", foto: "" }
      ]
    }
  };

  return { jugadores, partidos, temporadas };
}

const db = (() => {
  let datos = sembrarDemo();
  const oyentes = [];
  const partes = (p) => String(p || "").split("/").filter(Boolean);
  const clonar = (v) => (v === undefined || v === null ? null : JSON.parse(JSON.stringify(v)));
  const leer = (ruta) => {
    let n = datos;
    for (const k of partes(ruta)) {
      if (n === null || typeof n !== "object") return null;
      n = n[k];
    }
    return n === undefined ? null : n;
  };
  const escribir = (ruta, valor) => {
    const ks = partes(ruta);
    let n = datos;
    for (let i = 0; i < ks.length - 1; i++) {
      if (n[ks[i]] === null || n[ks[i]] === undefined || typeof n[ks[i]] !== "object") n[ks[i]] = {};
      n = n[ks[i]];
    }
    const ultima = ks[ks.length - 1];
    if (valor === null || valor === undefined) delete n[ultima];
    else n[ultima] = valor;
  };
  const avisar = () => oyentes.forEach((o) => o.cb({ val: () => clonar(leer(o.ruta)) }));
  return {
    ref(ruta = "") {
      return {
        on(evento, cb) {
          oyentes.push({ ruta, cb });
          cb({ val: () => clonar(leer(ruta)) });
        },
        push(valor) {
          const key = "k" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
          const p = Promise.resolve();
          p.key = key;
          if (valor !== undefined) {
            escribir(partes(ruta).concat(key).join("/"), clonar(valor));
            avisar();
          }
          return p;
        },
        update(cambios) {
          Object.keys(cambios).forEach((k) =>
            escribir(partes(ruta).concat(partes(k)).join("/"), clonar(cambios[k])));
          avisar();
          return Promise.resolve();
        },
        remove() {
          escribir(ruta, null);
          avisar();
          return Promise.resolve();
        }
      };
    }
  };
})();


// Usuario y contraseña de admin (cambialos si querés)
const ADMIN_USER = "admin";
const ADMIN_PASS = "1234";

// Convierte un link de Google Drive (de "compartir") a un link de imagen directa.
// Los links de Drive normales devuelven una página HTML, no la imagen en sí,
// por eso no cargan en un <img>. Si detecta un link de Drive, lo convierte;
// si no, devuelve la URL tal cual (para links de Imgur, etc. que ya son directos).
function convertirLinkFoto(url) {
  if (!url) return url;
  if (url.startsWith("data:")) return url;
  const m = url.match(/drive\.google\.com\/file\/d\/([^/]+)/) || url.match(/[?&]id=([^&]+)/);
  if (m && m[1]) return `https://lh3.googleusercontent.com/d/${m[1]}`;
  return url;
}

// ============ HELPERS ============
function calcularEstadisticas(j) {
  const pj = j.pj || 0;
  const puntos = j.puntos || 0;
  const promedio = pj > 0 ? (puntos / pj) : 0;
  return { ...j, pj, promedio };
}

function ordenarTabla(jugadores) {
  return [...jugadores]
    .map(calcularEstadisticas)
    .sort((a, b) => {
      if (b.promedio !== a.promedio) return b.promedio - a.promedio;
      if ((b.puntos||0) !== (a.puntos||0)) return (b.puntos||0) - (a.puntos||0);
      return (b.pj||0) - (a.pj||0);
    });
}

// ============ TEMPORADAS / PREMIOS ============
const PREMIOS_META = {
  campeon: { icono: "👑", nombre: "Campeón" },
  goleador: { icono: "⚽", nombre: "Goleador" },
  mejor_arquero: { icono: "🧤", nombre: "Mejor arquero" },
  equipo_ideal: { icono: "⭐", nombre: "Equipo ideal" }
};
const ORDEN_PREMIOS = ["campeon", "goleador", "mejor_arquero", "equipo_ideal"];

// Calcula los premios con la tabla actual.
// - Campeón: el puntero de la tabla.
// - Goleador: el que más goles hizo (si hay empate, lo comparten).
// - Mejor arquero y Equipo ideal (1 arquero + 4 de campo): salen por promedio,
//   pero solo entre quienes jugaron al menos la mitad de los partidos del que más jugó.
function calcularPremios(jugadores) {
  const tabla = ordenarTabla(jugadores).filter(j => j.pj > 0);
  if (tabla.length === 0) return [];
  const minPJ = Math.max(1, Math.ceil(Math.max(...tabla.map(j => j.pj)) * 0.5));
  const elegibles = tabla.filter(j => j.pj >= minPJ);
  const premios = [];
  const dar = (tipo, j) => premios.push({ tipo, jugadorId: j.id, nombre: j.nombre, foto: j.foto || "" });

  dar("campeon", tabla[0]);

  const maxGoles = Math.max(...tabla.map(j => j.goles || 0));
  if (maxGoles > 0) tabla.filter(j => (j.goles || 0) === maxGoles).forEach(j => dar("goleador", j));

  const arquero = elegibles.find(j => j.arquero);
  if (arquero) dar("mejor_arquero", arquero);

  const campo = elegibles.filter(j => !j.arquero).slice(0, arquero ? 4 : 5);
  (arquero ? [arquero, ...campo] : campo).forEach(j => dar("equipo_ideal", j));

  return premios;
}

// { jugadorId: cantidad de coronas (temporadas ganadas) }
function contarCoronas(temporadas) {
  const mapa = {};
  temporadas.forEach(t => (t.premios || []).forEach(p => {
    if (p.tipo === "campeon") mapa[p.jugadorId] = (mapa[p.jugadorId] || 0) + 1;
  }));
  return mapa;
}

// Todos los premios de un jugador, en el orden en que vienen las temporadas.
function premiosDeJugador(id, temporadas) {
  const lista = [];
  temporadas.forEach(t => (t.premios || []).forEach(p => {
    if (p.jugadorId === id) lista.push({ temporada: t.nombre, tipo: p.tipo });
  }));
  return lista;
}

function Coronas({ n }) {
  if (!n || n <= 0) return null;
  return (
    <span className="corona ml-1" title={n + (n === 1 ? " corona" : " coronas")}>
      👑{n > 1 && <span className="text-xs font-bold text-[#FFD700]">×{n}</span>}
    </span>
  );
}

// Sortea dos equipos balanceados según calidad. Si hay 2+ arqueros, reparte
// uno de cada lado. Si hay 0 o 1 arquero, ese arquero cuenta como 4 estrellas
// para el sorteo (su calidad real no se usa para balancear).
function armarEquipos(disponibles) {
  const arqueros = disponibles.filter(j => j.arquero);
  const campo = disponibles.filter(j => !j.arquero);
  let equipoA = [], equipoB = [], sumaA = 0, sumaB = 0;

  if (arqueros.length >= 2) {
    const arqOrdenados = [...arqueros].sort((a, b) => b.calidad - a.calidad);
    arqOrdenados.forEach((j, i) => {
      if (i % 2 === 0) { equipoA.push(j); sumaA += j.calidad; }
      else { equipoB.push(j); sumaB += j.calidad; }
    });
    const resto = [...campo].sort((a, b) => b.calidad - a.calidad);
    resto.forEach(j => {
      if (sumaA <= sumaB) { equipoA.push(j); sumaA += j.calidad; }
      else { equipoB.push(j); sumaB += j.calidad; }
    });
  } else {
    const todos = disponibles
      .map(j => ({ ...j, valorDraft: j.arquero ? 4 : j.calidad }))
      .sort((a, b) => b.valorDraft - a.valorDraft);
    todos.forEach(j => {
      if (sumaA <= sumaB) { equipoA.push(j); sumaA += j.valorDraft; }
      else { equipoB.push(j); sumaB += j.valorDraft; }
    });
  }
  return { equipoA, equipoB };
}

function Estrellas({ n, onClick }) {
  return (
    <span className="text-yellow-500 text-xl select-none">
      {Array.from({ length: 5 }).map((_, i) => (
        <span
          key={i}
          onClick={() => onClick && onClick(i + 1)}
          style={{ cursor: onClick ? "pointer" : "default" }}
        >
          {i < n ? "★" : "☆"}
        </span>
      ))}
    </span>
  );
}

function Cuadritos({ ultimos = [] }) {
  const colores = { V: "#22c55e", E: "#eab308", D: "#ef4444" };
  const slots = [...ultimos].slice(0, 5);
  while (slots.length < 5) slots.push(null);
  return (
    <div className="flex">
      {slots.map((r, i) => (
        <span
          key={i}
          className="cuadrito"
          style={{ background: r ? colores[r] : "#d1d5db" }}
          title={r === "V" ? "Ganado" : r === "E" ? "Empatado" : r === "D" ? "Perdido" : "—"}
        ></span>
      ))}
    </div>
  );
}

// ============ PODIO (estilo tarjetas FIFA) ============
function TarjetaPodio({ j, puesto, coronas = 0, onSelect }) {

    1: { medalla: "🥇", frame: "frame-oro", card: "card-oro pulse-glow", label: "1°", color: "text-[#FFD700]" },

  return (

      <div className={`text-2xl mb-1 ${meta.color} badge-neon`}>{meta.medalla} {meta.label}</div>
      <div className={`foto-podio-frame ${meta.frame} mb-2`}>
        <img src={j.foto || SIN_FOTO} className="foto-podio" alt={j.nombre} />
      </div>
      <p className="font-bold text-center leading-tight">{j.nombre} {j.arquero && "🧤"}<Coronas n={coronas} /></p>
      <p className={`text-2xl font-extrabold ${meta.color}`}>{j.promedio.toFixed(2)}</p>
      <p className="text-[10px] uppercase tracking-wide text-slate-400 mb-2">pts / partido</p>
      <div className="grid grid-cols-3 gap-2 w-full text-center text-xs text-slate-300 border-t border-white/10 pt-2">
        <div><p className="font-bold text-white">{j.pj || 0}</p><p>PJ</p></div>
        <div><p className="font-bold text-white">{j.pg || 0}</p><p>PG</p></div>
        <div><p className="font-bold text-white">{j.goles || 0}</p><p>Goles</p></div>
      </div>
    </div>
  );
}

function Podio({ tabla, coronas = {}, onSelect }) {
  const top3 = tabla.slice(0, 3);
  if (top3.length === 0) return null;
  const orden = [1, 0, 2]; // 2do - 1ro - 3ro

// ============ IMAGEN DE PREMIOS DE LA TEMPORADA ============
function cargarImagen(src) {
  return new Promise(resolve => {
    if (!src) return resolve(null);
    const img = new Image();
    if (!src.startsWith("data:")) img.crossOrigin = "anonymous";
    const timer = setTimeout(() => resolve(null), 8000);
    img.onload = () => { clearTimeout(timer); resolve(img); };
    img.onerror = () => { clearTimeout(timer); resolve(null); };
    img.src = src;
  });
}

function dibujarTexto(ctx, txt, x, y, size, color, bold = true, maxW = 940) {
  ctx.font = (bold ? "bold " : "") + size + "px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif";
  ctx.fillStyle = color;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(txt, x, y, maxW);
}

// Foto redonda con aro de color. Si la foto no cargó, dibuja la inicial.
function dibujarAvatar(ctx, img, nombre, cx, cy, r, aro) {
  ctx.save();
  ctx.shadowColor = aro;
  ctx.shadowBlur = 30;
  ctx.beginPath();
  ctx.arc(cx, cy, r + 8, 0, Math.PI * 2);
  ctx.fillStyle = aro;
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.clip();
  if (img) {
    const lado = Math.min(img.width, img.height);
    const sx = (img.width - lado) / 2;
    const sy = (img.height - lado) * 0.25;
    ctx.drawImage(img, sx, sy, lado, lado, cx - r, cy - r, r * 2, r * 2);
  } else {
    ctx.fillStyle = "#1b2840";
    ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
    dibujarTexto(ctx, (nombre || "?").charAt(0).toUpperCase(), cx, cy, r, "#E8EEFC");
  }
  ctx.restore();
}

// Arma la imagen (1080x1700) con campeón, goleador, mejor arquero y equipo ideal.
async function generarImagenTemporada(t) {
  const W = 1080, H = 1700;
  const canvas = document.createElement("canvas");
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext("2d");
  const premios = t.premios || [];
  const de = (tipo) => premios.filter(p => p.tipo === tipo);
  const stat = (id) => (t.tabla || []).find(x => x.id === id) || {};

  const ids = [...new Set(premios.map(p => p.jugadorId))];
  const imgs = {};
  await Promise.all(ids.map(async id => {
    const p = premios.find(x => x.jugadorId === id);
    imgs[id] = await cargarImagen(p.foto);
  }));

  // fondo
  const fondo = ctx.createLinearGradient(0, 0, 0, H);
  fondo.addColorStop(0, "#060B18");
  fondo.addColorStop(0.5, "#0B1220");
  fondo.addColorStop(1, "#0E1730");
  ctx.fillStyle = fondo;
  ctx.fillRect(0, 0, W, H);
  const brilloOro = ctx.createRadialGradient(W * 0.85, 0, 0, W * 0.85, 0, 650);
  brilloOro.addColorStop(0, "rgba(245,179,1,0.22)");
  brilloOro.addColorStop(1, "rgba(245,179,1,0)");
  ctx.fillStyle = brilloOro;
  ctx.fillRect(0, 0, W, H);
  const brilloCeleste = ctx.createRadialGradient(W * 0.15, 0, 0, W * 0.15, 0, 650);
  brilloCeleste.addColorStop(0, "rgba(34,211,238,0.18)");
  brilloCeleste.addColorStop(1, "rgba(34,211,238,0)");
  ctx.fillStyle = brilloCeleste;
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = "rgba(255,215,0,0.35)";
  ctx.lineWidth = 4;
  ctx.strokeRect(30, 30, W - 60, H - 60);

  // encabezado
  dibujarTexto(ctx, "🏆", W / 2, 110, 90, "#FFD700");
  const gradTitulo = ctx.createLinearGradient(W / 2 - 330, 0, W / 2 + 330, 0);
  gradTitulo.addColorStop(0, "#22D3EE");
  gradTitulo.addColorStop(0.5, "#FFFFFF");
  gradTitulo.addColorStop(1, "#FFD700");
  dibujarTexto(ctx, "TORNEO DE FÚTBOL", W / 2, 205, 62, gradTitulo);
  dibujarTexto(ctx, t.nombre || "Temporada", W / 2, 272, 42, "#E8EEFC");
  if (t.cerradaEn) {
    const f = new Date(t.cerradaEn).toLocaleDateString("es-AR", { day: "numeric", month: "long", year: "numeric" });
    dibujarTexto(ctx, f, W / 2, 322, 26, "#94A3B8", false);
  }

  // campeón
  const camp = de("campeon")[0];
  if (camp) {
    dibujarTexto(ctx, "👑", W / 2, 415, 80, "#FFD700");
    dibujarAvatar(ctx, imgs[camp.jugadorId], camp.nombre, W / 2, 620, 150, "#FFD700");
    dibujarTexto(ctx, "CAMPEÓN", W / 2, 832, 38, "#FFD700");
    dibujarTexto(ctx, camp.nombre, W / 2, 895, 68, "#FFFFFF", true, 900);
    const sc = stat(camp.jugadorId);
    if (sc.promedio != null) {
      dibujarTexto(ctx, Number(sc.promedio).toFixed(2) + " pts/partido · " + (sc.pj || 0) + " PJ", W / 2, 952, 30, "#94A3B8", false);
    }
  }

  // goleador y mejor arquero
  const bloques = [];
  const gol = de("goleador");
  if (gol.length) {
    const g = stat(gol[0].jugadorId).goles || 0;
    bloques.push({ label: "⚽ GOLEADOR", ps: gol, texto: g + (g === 1 ? " gol" : " goles") });
  }
  const arq = de("mejor_arquero");
  if (arq.length) {
    const pr = stat(arq[0].jugadorId).promedio || 0;
    bloques.push({ label: "🧤 MEJOR ARQUERO", ps: arq, texto: Number(pr).toFixed(2) + " pts/partido" });
  }
  const xs = bloques.length === 1 ? [W / 2] : [W * 0.27, W * 0.73];
  bloques.forEach((b, i) => {
    const x = xs[i];
    dibujarTexto(ctx, b.label, x, 1020, 34, "#22D3EE", true, 440);
    dibujarAvatar(ctx, imgs[b.ps[0].jugadorId], b.ps[0].nombre, x, 1150, 85, "#22D3EE");
    dibujarTexto(ctx, b.ps.map(p => p.nombre).join(" / "), x, 1290, 44, "#FFFFFF", true, 440);
    dibujarTexto(ctx, b.texto, x, 1335, 28, "#94A3B8", false, 440);
  });

  // equipo ideal
  const eq = de("equipo_ideal");
  if (eq.length) {
    dibujarTexto(ctx, "⭐ EQUIPO IDEAL", W / 2, 1405, 36, "#FFD700");
    const sep = 190;
    const x0 = W / 2 - ((eq.length - 1) * sep) / 2;
    eq.forEach((p, i) => {
      const x = x0 + i * sep;
      dibujarAvatar(ctx, imgs[p.jugadorId], p.nombre, x, 1520, 65, "#FFD700");
      dibujarTexto(ctx, p.nombre + (stat(p.jugadorId).arquero ? " 🧤" : ""), x, 1625, 26, "#E8EEFC", true, 175);
    });
  }

  return canvas;
}

// Ventana con la imagen lista para compartir o descargar
function ImagenTemporada({ temporada, cerrada, onClose }) {
  const [url, setUrl] = useState(null);
  const [blob, setBlob] = useState(null);
  const [error, setError] = useState("");
  const nombreArchivo = "premios-" + (temporada.nombre || "temporada").replace(/[^a-zA-Z0-9]+/g, "-") + ".png";

  useEffect(() => {
    let creada = null;
    let cancelado = false;
    generarImagenTemporada(temporada)
      .then(canvas => new Promise((ok, fail) =>
        canvas.toBlob(b => b ? ok(b) : fail(new Error("no se pudo generar la imagen")), "image/png")))
      .then(b => {
        if (cancelado) return;
        creada = URL.createObjectURL(b);
        setBlob(b);
        setUrl(creada);
      })
      .catch(e => { if (!cancelado) setError(e.message); });
    return () => { cancelado = true; if (creada) URL.revokeObjectURL(creada); };
  }, []);

  const compartir = async () => {
    const file = new File([blob], nombreArchivo, { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: temporada.nombre }); } catch (e) {}
    } else {
      alert("Este navegador no deja compartir directo. Usá Descargar.");
    }
  };

  const descargar = () => {
    const a = document.createElement("a");
    a.href = url;
    a.download = nombreArchivo;
    document.body.appendChild(a);
    a.click();
    a.remove();
  };

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-card p-5" onClick={e => e.stopPropagation()}>
        <div className="flex items-center justify-between mb-3">
          <h2 className="font-extrabold text-lg">{cerrada ? "🏁 ¡Terminó " + temporada.nombre + "!" : "🏆 " + temporada.nombre}</h2>
          <button className="text-slate-400 text-2xl leading-none px-2" onClick={onClose} aria-label="Cerrar">✕</button>
        </div>
        {!url && !error && <p className="text-slate-400 text-sm py-10 text-center">Armando la imagen…</p>}
        {error && <p className="text-red-400 text-sm py-6 text-center">No se pudo armar la imagen: {error}</p>}
        {url && <img src={url} alt="Premios de la temporada" className="w-full rounded-xl mb-3" />}
        {url && (
          <div className="grid grid-cols-2 gap-2">
            <button className="bg-[#FFD700] text-[#06131F] rounded-xl py-3 font-bold" onClick={compartir}>📤 Compartir</button>
            <button className="bg-[#22D3EE] text-[#06131F] rounded-xl py-3 font-bold" onClick={descargar}>⬇️ Descargar</button>
          </div>
        )}
      </div>
    </div>
  );
}

// ============ PERFIL DE JUGADOR (modal) ============
function PerfilJugador({ j, posicion, coronas, premios, onClose }) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  const pj = j.pj || 0;
  const pct = pj > 0 ? Math.round((j.promedio / 3) * 100) : 0;

// Toma la foto elegida del celular, la recorta cuadrada y la achica a 256x256 JPEG
// (~10-15 KB) para guardarla como texto en la base de datos, sin Firebase Storage.
function comprimirFoto(file, lado = 256) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("no se pudo leer el archivo"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("el archivo no es una imagen válida"));
      img.onload = () => {
        const lado0 = Math.min(img.width, img.height);
        const sx = (img.width - lado0) / 2;
        const sy = (img.height - lado0) * 0.25;
        const canvas = document.createElement("canvas");
        canvas.width = lado;
        canvas.height = lado;
        canvas.getContext("2d").drawImage(img, sx, sy, lado0, lado0, 0, 0, lado, lado);
        resolve(canvas.toDataURL("image/jpeg", 0.8));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// ============ CANCHA (armado manual) ============
// fichas: [{ id, nombre, foto, x, y, equipo }]  (x, y en % de la cancha)
// Mitad de arriba = Equipo A, mitad de abajo = Equipo B.
function Cancha({ fichas, editable, selId, onSelect, onMove, onTapCancha }) {
  const ref = useRef(null);
  const drag = useRef(null);

  const posDe = (e) => {
    const r = ref.current.getBoundingClientRect();
    return {
      x: Math.min(94, Math.max(6, ((e.clientX - r.left) / r.width) * 100)),
      y: Math.min(95, Math.max(5, ((e.clientY - r.top) / r.height) * 100))
    };
  };

  return (
    <div className="w-full mx-auto" style={{ maxWidth: 420 }}>
    <div
      ref={ref}
      className="relative w-full rounded-xl overflow-hidden select-none"
      style={{ paddingTop: "150%", background: "#2f8f4e", touchAction: editable ? "pan-y" : "auto" }}
      onClick={(e) => { if (editable && onTapCancha) onTapCancha(posDe(e)); }}
    >
      <svg viewBox="0 0 100 150" className="absolute w-full h-full" style={{ top: 0, left: 0, pointerEvents: "none" }}>
        {Array.from({ length: 10 }).map((_, i) => (
          <rect key={i} x="0" y={i * 15} width="100" height="15" fill={i % 2 ? "#2f8f4e" : "#35a057"} />
        ))}
        <g fill="none" stroke="rgba(255,255,255,0.85)" strokeWidth="0.6">
          <rect x="3" y="3" width="94" height="144" />
          <line x1="3" y1="75" x2="97" y2="75" />
          <circle cx="50" cy="75" r="12" />
          <rect x="25" y="3" width="50" height="22" />
          <rect x="38" y="3" width="24" height="8" />
          <path d="M 41.06 25 A 12 12 0 0 0 58.94 25" />
          <rect x="25" y="125" width="50" height="22" />
          <rect x="38" y="139" width="24" height="8" />
          <path d="M 41.06 125 A 12 12 0 0 1 58.94 125" />
        </g>
        <g fill="rgba(255,255,255,0.9)">
          <circle cx="50" cy="75" r="0.9" />
          <circle cx="50" cy="17" r="0.9" />
          <circle cx="50" cy="133" r="0.9" />
        </g>
      </svg>

      <span className="absolute text-[11px] font-extrabold tracking-widest" style={{ top: 8, left: 10, color: "rgba(255,255,255,0.75)" }}>EQUIPO A</span>
      <span className="absolute text-[11px] font-extrabold tracking-widest" style={{ bottom: 8, left: 10, color: "rgba(255,255,255,0.75)" }}>EQUIPO B</span>

      {fichas.map(f => (
        <div
          key={f.id}
          className={"ficha" + (editable ? " editable" : "") + (selId === f.id ? " sel" : "")}
          style={{ left: f.x + "%", top: f.y + "%" }}
          onClick={(e) => e.stopPropagation()}
          onPointerDown={(e) => {
            if (!editable) return;
            e.stopPropagation();
            e.currentTarget.setPointerCapture(e.pointerId);
            drag.current = { id: f.id, sx: e.clientX, sy: e.clientY, moved: false };
          }}
          onPointerMove={(e) => {
            const d = drag.current;
            if (!d || d.id !== f.id) return;
            if (!d.moved && Math.hypot(e.clientX - d.sx, e.clientY - d.sy) < 6) return;
            d.moved = true;
            onMove(f.id, posDe(e));
          }}
          onPointerUp={() => {
            const d = drag.current;
            drag.current = null;
            if (d && !d.moved && onSelect) onSelect(f.id);
          }}
          onPointerCancel={() => { drag.current = null; }}
        >
          {f.foto
            ? <img src={f.foto} alt={f.nombre} className="ficha-foto" draggable="false"
                style={{ borderColor: f.equipo === "A" ? "#3b82f6" : "#ef4444" }} />
            : <div className="ficha-foto" style={{ borderColor: f.equipo === "A" ? "#3b82f6" : "#ef4444" }}>
                {(f.nombre || "?").charAt(0).toUpperCase()}
              </div>}
          <span className="ficha-nombre">{f.nombre}{f.arquero ? " 🧤" : ""}</span>
        </div>
      ))}
    </div>
    </div>
  );
}

// Vista de solo lectura de un partido armado a mano
function fichasDePartido(partido, jugadores) {
  const pos = partido.posiciones || {};
  return Object.keys(pos).map(id => {
    const j = jugadores.find(x => x.id === id);
    if (!j) return null;
    return {
      id, nombre: j.nombre, foto: j.foto, arquero: j.arquero,
      x: pos[id].x, y: pos[id].y,
      equipo: (partido.equipoA || []).includes(id) ? "A" : "B"
    };
  }).filter(Boolean);
}

  const [selPool, setSelPool] = useState(null);     // jugador elegido de la lista para ubicar
  const [selFicha, setSelFicha] = useState(null);   // ficha elegida en la cancha

  const toggle = (id) => setSeleccionados(s => ({ ...s, [id]: !s[id] }));

  const disponibles = jugadores.filter(j => seleccionados[j.id]);
  const sinUbicar = disponibles.filter(j => !posiciones[j.id]);
  const fichas = disponibles.filter(j => posiciones[j.id]).map(j => ({
    id: j.id, nombre: j.nombre, foto: j.foto, arquero: j.arquero,

  }));
  const fichasA = fichas.filter(f => f.equipo === "A");
  const fichasB = fichas.filter(f => f.equipo === "B");
  const calidadDe = (lista) => lista.reduce((s, f) => s + ((jugadores.find(j => j.id === f.id) || {}).calidad || 0), 0);

  const moverFicha = (id, pos) => setPosiciones(p => ({ ...p, [id]: pos }));
  const tocarCancha = (pos) => {
    if (!selPool) return;
    setPosiciones(p => ({ ...p, [selPool]: pos }));
    setSelPool(null);
  };
  const sacarFicha = () => {
    if (!selFicha) return;
    setPosiciones(p => { const c = { ...p }; delete c[selFicha]; return c; });

  const sortear = () => {
    if (disponibles.length < 2) return alert("Seleccioná al menos 2 jugadores disponibles");
    setPreview(armarEquipos(disponibles));
  };

  const guardarManual = () => {
    if (fichasA.length === 0 || fichasB.length === 0) {
      return alert("Poné al menos un jugador en cada mitad de la cancha (arriba Equipo A, abajo Equipo B)");
    }
    if (sinUbicar.length > 0 && !confirm("Quedan " + sinUbicar.length + " jugador(es) sin ubicar. Se van a dejar afuera de esta fecha. ¿Seguir?")) return;
    const pos = {};
    fichas.forEach(f => { pos[f.id] = { x: Math.round(f.x * 10) / 10, y: Math.round(f.y * 10) / 10 }; });
    db.ref("partidos").push({
      fecha,
      disponibles: fichas.map(f => f.id),
      equipoA: fichasA.map(f => f.id),
      equipoB: fichasB.map(f => f.id),
      posiciones: pos,
      manual: true,
      resultado: null,
      finalizado: false
    });
    setFecha(""); setSeleccionados({}); setPosiciones({}); setSelPool(null); setSelFicha(null);
    alert("Fecha creada con el armado manual");
  };

  const guardarFecha = () => {
    if (!fecha) return alert("Elegí una fecha");
    if (modo === "manual") return guardarManual();
    if (!preview) return alert("Primero sorteá los equipos");
    db.ref("partidos").push({
      fecha,
      disponibles: disponibles.map(j => j.id),
      equipoA: preview.equipoA.map(j => j.id),
      equipoB: preview.equipoB.map(j => j.id),
      resultado: null,
      finalizado: false
    });
    setFecha(""); setSeleccionados({}); setPreview(null);
    alert("Fecha creada con los equipos sorteados");
  };

  const nombreDe = (id) => (jugadores.find(j => j.id === id) || {}).nombre || "?";

  return (
    <div>
      <div className="bg-white p-4 rounded-2xl shadow mb-4">
        <h3 className="font-bold mb-2">Nueva fecha</h3>
        <input type="date" className="border rounded-lg p-2 mb-3"
          value={fecha} onChange={e => setFecha(e.target.value)} />
        <p className="text-sm font-semibold mb-1">Jugadores disponibles:</p>
        <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 mb-3">
          {jugadores.map(j => (
            <label key={j.id} className="flex items-center gap-2 text-sm bg-[#EAF4FC] rounded-lg p-2">
              <input type="checkbox" checked={!!seleccionados[j.id]} onChange={() => toggle(j.id)} />
              {j.nombre} {j.arquero && "🧤"}
            </label>
          ))}
        </div>
        <div className="flex gap-2 mb-3">
          {[["sorteo", "🎲 Sortear"], ["manual", "✋ Armar a mano"]].map(([k, label]) => (
            <button key={k}
              className={`px-3 py-2 rounded-lg text-sm font-bold ${modo === k ? "bg-[#3E7CB1] text-white" : "bg-[#EAF4FC] text-[#1B4B7A]"}`}
              onClick={() => setModo(k)}>
              {label}
            </button>
          ))}
        </div>
        {modo === "sorteo" && (
          <button className="bg-[#3E7CB1] text-white rounded-lg px-4 py-2 font-bold mr-2" onClick={sortear}>
            Sortear equipos
          </button>
        )}
        {modo === "sorteo" && preview && (
          <button className="bg-blue-600 text-white rounded-lg px-4 py-2 font-bold" onClick={guardarFecha}>
            Guardar fecha
          </button>
        )}

        {modo === "sorteo" && preview && (
          <div className="grid grid-cols-2 gap-3 mt-4">
            <div className="bg-blue-50 rounded-lg p-3">
              <p className="font-bold text-blue-700 mb-1">Equipo A</p>
              {preview.equipoA.map(j => <p key={j.id} className="text-sm">{j.nombre} {j.arquero && "🧤"} <Estrellas n={j.calidad} /></p>)}
            </div>
            <div className="bg-red-50 rounded-lg p-3">
              <p className="font-bold text-red-700 mb-1">Equipo B</p>
              {preview.equipoB.map(j => <p key={j.id} className="text-sm">{j.nombre} {j.arquero && "🧤"} <Estrellas n={j.calidad} /></p>)}
            </div>
          </div>
        )}

        {modo === "manual" && (
          <div className="mt-2">
            {disponibles.length === 0 ? (
              <p className="text-sm text-gray-500">Marcá arriba los jugadores disponibles y después ubicalos en la cancha.</p>
            ) : (
              <>
                <p className="text-xs text-gray-500 mb-2">
                  1) Tocá un jugador de la lista. 2) Tocá la cancha donde lo querés. Después podés arrastrarlo. La mitad de arriba es el Equipo A y la de abajo el Equipo B.
                </p>

                <p className="text-sm font-semibold mb-1">Sin ubicar ({sinUbicar.length}):</p>
                <div className="flex flex-wrap gap-2 mb-3 min-h-[2rem]">
                  {sinUbicar.map(j => (
                    <button key={j.id}
                      className={`rounded-full px-3 py-1 text-sm font-bold border ${selPool === j.id ? "bg-[#FFD700] border-yellow-500 text-[#06131F]" : "bg-[#EAF4FC] border-[#3E7CB1] text-[#1B4B7A]"}`}
                      onClick={() => { setSelFicha(null); setSelPool(selPool === j.id ? null : j.id); }}>
                      {j.nombre}{j.arquero ? " 🧤" : ""}
                    </button>
                  ))}
                  {sinUbicar.length === 0 && <span className="text-sm text-green-700">Todos ubicados ✅</span>}
                </div>

                {selPool && <p className="text-sm font-bold text-yellow-700 mb-2">👆 Tocá la cancha para ubicar a {(jugadores.find(j => j.id === selPool) || {}).nombre}</p>}

                <Cancha
                  fichas={fichas}
                  editable
                  selId={selFicha}
                  onSelect={(id) => { setSelPool(null); setSelFicha(selFicha === id ? null : id); }}
                  onMove={moverFicha}
                  onTapCancha={tocarCancha}
                />

                <div className="grid grid-cols-2 gap-2 mt-3 text-sm">
                  <div className="bg-blue-50 rounded-lg p-2 text-blue-800"><b>Equipo A:</b> {fichasA.length} jugadores · ★ {calidadDe(fichasA)}</div>
                  <div className="bg-red-50 rounded-lg p-2 text-red-800"><b>Equipo B:</b> {fichasB.length} jugadores · ★ {calidadDe(fichasB)}</div>
                </div>

                <div className="flex flex-wrap gap-2 mt-3">
                  <button className="bg-blue-600 text-white rounded-lg px-4 py-2 font-bold" onClick={guardarFecha}>Guardar fecha</button>
                  {selFicha && (
                    <button className="bg-orange-500 text-white rounded-lg px-4 py-2 font-bold" onClick={sacarFicha}>Sacar de la cancha</button>
                  )}
                  {fichas.length > 0 && (
                    <button className="bg-gray-300 rounded-lg px-4 py-2"
                      onClick={() => { if (confirm("¿Sacar a todos de la cancha?")) { setPosiciones({}); setSelFicha(null); } }}>
                      Limpiar cancha
                    </button>
                  )}
                </div>
              </>
            )}
          </div>
        )}
      </div>

      <h3 className="font-bold mb-2">Fechas cargadas</h3>
      <div className="space-y-3">
        {partidos.slice().reverse().map(p => (
          <div key={p.id} className="bg-white rounded-2xl shadow p-3">
            <p className="font-semibold">{p.fecha} {p.finalizado ? "✅ Finalizado" : "⏳ Pendiente"}</p>
            <div className="grid grid-cols-2 gap-2 text-sm mt-2">
              <div><span className="font-bold text-blue-700">Equipo A:</span> {(p.equipoA || []).map(nombreDe).join(", ")}</div>
              <div><span className="font-bold text-red-700">Equipo B:</span> {(p.equipoB || []).map(nombreDe).join(", ")}</div>
            </div>
            <CanchaToggle partido={p} jugadores={jugadores} />
            {p.finalizado && (
              <p className="text-sm mt-1 text-gray-600">
                Resultado: {p.resultado === "A" ? "Ganó Equipo A" : p.resultado === "B" ? "Ganó Equipo B" : "Empate"}
              </p>
            )}
          </div>
        ))}
        {partidos.length === 0 && <p className="text-gray-400 text-center">No hay fechas cargadas</p>}
      </div>
    </div>
  );
}

// ============ ADMIN: RESULTADOS ============
function FilaGoles({ nombre, valor, onChange }) {
  return (
    <div className="flex items-center justify-between text-sm py-1">
      <span>{nombre}</span>
      <input
        type="number" min="0" className="border rounded-lg w-16 p-1 text-center"
        value={valor} onChange={e => onChange(parseInt(e.target.value || "0", 10))}
      />
    </div>
  );
}

function AdminResultados({ jugadores, partidos }) {
  const pendientes = partidos.filter(p => !p.finalizado);
  const [golesPorPartido, setGolesPorPartido] = useState({});

  const setGol = (partidoId, jugadorId, valor) => {
    setGolesPorPartido(g => ({
      ...g,
      [partidoId]: { ...(g[partidoId] || {}), [jugadorId]: valor }
    }));
  };

  const cargarResultado = (partido, resultado) => {
    // resultado: "A" (ganó A), "B" (ganó B), "E" (empate)
    if (!confirm("¿Confirmar este resultado? No se puede deshacer.")) return;

    const golesDeEsteMatch = golesPorPartido[partido.id] || {};

    const actualizar = (id, tipo) => {
      const j = jugadores.find(x => x.id === id);
      if (!j) return;
      const puntosGanados = tipo === "V" ? 3 : tipo === "E" ? 1 : 0;
      const golesEnEstePartido = golesDeEsteMatch[id] || 0;
      const nuevos = {
        pj: (j.pj || 0) + 1,
        pg: (j.pg || 0) + (tipo === "V" ? 1 : 0),
        pe: (j.pe || 0) + (tipo === "E" ? 1 : 0),
        pp: (j.pp || 0) + (tipo === "D" ? 1 : 0),
        puntos: (j.puntos || 0) + puntosGanados,
        goles: (j.goles || 0) + golesEnEstePartido,
        ultimos: [tipo, ...(j.ultimos || [])].slice(0, 5),
        historial: [...(j.historial || []), { fecha: partido.fecha, resultado: tipo, goles: golesEnEstePartido }]
      };
      db.ref("jugadores/" + id).update(nuevos);
    };

    const equipoA = partido.equipoA || [];
    const equipoB = partido.equipoB || [];

    if (resultado === "E") {
      equipoA.forEach(id => actualizar(id, "E"));
      equipoB.forEach(id => actualizar(id, "E"));
    } else if (resultado === "A") {
      equipoA.forEach(id => actualizar(id, "V"));
      equipoB.forEach(id => actualizar(id, "D"));
    } else {
      equipoA.forEach(id => actualizar(id, "D"));
      equipoB.forEach(id => actualizar(id, "V"));
    }

    db.ref("partidos/" + partido.id).update({ resultado, finalizado: true });
    setGolesPorPartido(g => { const copia = { ...g }; delete copia[partido.id]; return copia; });
  };

  const jugadorDe = (id) => jugadores.find(j => j.id === id) || { id, nombre: "?" };

  return (
    <div className="space-y-3">
      <h3 className="font-bold mb-2">Cargar resultado</h3>
      {pendientes.map(p => {
        const goles = golesPorPartido[p.id] || {};
        return (
          <div key={p.id} className="bg-white rounded-2xl shadow p-3">
            <p className="font-semibold mb-2">{p.fecha}</p>
            <p className="text-xs text-gray-500 mb-1">Goles de cada jugador en este partido (opcional):</p>
            <div className="grid grid-cols-2 gap-3 text-sm mb-3">
              <div>
                <p className="font-bold text-blue-700 mb-1">Equipo A</p>
                {(p.equipoA || []).map(id => (
                  <FilaGoles key={id} nombre={jugadorDe(id).nombre}
                    valor={goles[id] || 0}
                    onChange={v => setGol(p.id, id, v)} />
                ))}
              </div>
              <div>
                <p className="font-bold text-red-700 mb-1">Equipo B</p>
                {(p.equipoB || []).map(id => (
                  <FilaGoles key={id} nombre={jugadorDe(id).nombre}
                    valor={goles[id] || 0}
                    onChange={v => setGol(p.id, id, v)} />
                ))}
              </div>
            </div>
            <div className="flex gap-2">
              <button className="bg-blue-600 text-white rounded-lg px-3 py-2 text-sm font-bold" onClick={() => cargarResultado(p, "A")}>Ganó Equipo A</button>
              <button className="bg-gray-500 text-white rounded-lg px-3 py-2 text-sm font-bold" onClick={() => cargarResultado(p, "E")}>Empate</button>
              <button className="bg-red-600 text-white rounded-lg px-3 py-2 text-sm font-bold" onClick={() => cargarResultado(p, "B")}>Ganó Equipo B</button>
            </div>
          </div>
        );
      })}
      {pendientes.length === 0 && <p className="text-gray-400 text-center">No hay fechas pendientes de resultado</p>}
    </div>
  );
}

// ============ ADMIN: TEMPORADA ============
function AdminTemporada({ jugadores, partidos, temporadas }) {
  const [nombre, setNombre] = useState("");
  const [imagen, setImagen] = useState(null);
  const tabla = useMemo(() => ordenarTabla(jugadores).filter(j => (j.pj || 0) > 0), [jugadores]);
  const premios = useMemo(() => calcularPremios(jugadores), [jugadores]);
  const pendientes = partidos.filter(p => !p.finalizado).length;
  const nombreFinal = nombre.trim() || ("Temporada " + (temporadas.length + 1));

  const terminar = () => {
    if (premios.length === 0) return alert("Todavía no hay partidos jugados en esta temporada.");
    if (!confirm('¿Terminar "' + nombreFinal + '"?\n\nSe reparten los premios, el puntero se lleva la corona 👑 y se reinician las tablas. No se puede deshacer.')) return;

    const key = db.ref("temporadas").push().key;
    const updates = {};

    // 1) Foto final de la temporada + premios
    const datosTemporada = {
      nombre: nombreFinal,
      cerradaEn: new Date().toISOString(),
      tabla: tabla.map(j => ({
        id: j.id, nombre: j.nombre, foto: j.foto || "", arquero: !!j.arquero,
        pj: j.pj || 0, pg: j.pg || 0, pe: j.pe || 0, pp: j.pp || 0,
        puntos: j.puntos || 0, goles: j.goles || 0,
        promedio: Number(j.promedio.toFixed(2))
      })),
      premios
    };
    updates["temporadas/" + key] = datosTemporada;

    // 2) Reinicio de estadísticas (la calidad, la foto y el arquero se mantienen)
    jugadores.forEach(j => {
      const base = "jugadores/" + j.id + "/";
      updates[base + "pj"] = 0;
      updates[base + "pg"] = 0;
      updates[base + "pe"] = 0;
      updates[base + "pp"] = 0;
      updates[base + "puntos"] = 0;
      updates[base + "goles"] = 0;
      updates[base + "ultimos"] = null;
      updates[base + "historial"] = null;
    });

    // 3) Los partidos ya jugados se archivan; las fechas pendientes pasan a la temporada nueva
    partidos.filter(p => p.finalizado).forEach(p => {
      updates["partidos/" + p.id + "/archivada"] = key;
    });

    db.ref().update(updates)
      .then(() => { setNombre(""); setImagen({ id: key, recien: true, ...datosTemporada }); })
      .catch(err => alert("No se pudo cerrar la temporada: " + err.message));
  };

  const ordenadas = [...temporadas].sort((a, b) => (b.cerradaEn || "").localeCompare(a.cerradaEn || ""));

  return (
    <div>
      <div className="bg-white p-4 rounded-2xl shadow mb-4">
        <h3 className="font-bold mb-2">Terminar temporada</h3>
        <input className="border rounded-lg w-full p-2 mb-3"
          placeholder={"Nombre (por defecto: Temporada " + (temporadas.length + 1) + ")"}
          value={nombre} onChange={e => setNombre(e.target.value)} />

        <p className="text-sm font-semibold mb-1">Premios que se van a repartir:</p>
        {premios.length > 0 ? (
          <div className="bg-[#EAF4FC] rounded-lg p-3 mb-3 space-y-1">
            {premios.map((p, i) => (
              <p key={i} className="text-sm">
                {PREMIOS_META[p.tipo].icono} <b>{PREMIOS_META[p.tipo].nombre}:</b> {p.nombre}
              </p>
            ))}
          </div>
        ) : <p className="text-sm text-gray-400 mb-3">Todavía no hay partidos jugados.</p>}

        <p className="text-xs text-gray-500 mb-3">
          Mejor arquero y equipo ideal (1 arquero + 4 de campo) salen por promedio, entre quienes jugaron al menos la mitad de los partidos del que más jugó.
          {pendientes > 0 && " Las " + pendientes + " fecha(s) pendientes se mantienen para la temporada nueva."}
        </p>

        <button className="bg-yellow-500 text-white rounded-lg px-4 py-2 font-bold" onClick={terminar}>
          🏁 Terminar temporada y premiar
        </button>
      </div>

      <h3 className="font-bold mb-2">Temporadas anteriores</h3>
      <div className="bg-white rounded-2xl shadow divide-y">
        {ordenadas.map(t => {
          const campeon = (t.premios || []).find(p => p.tipo === "campeon");
          return (
            <div key={t.id} className="p-3 flex items-center justify-between gap-2 text-sm">
              <span className="font-semibold">{t.nombre}</span>
              <span className="flex-1 text-right">👑 {campeon ? campeon.nombre : "—"}</span>
              <button className="text-blue-600 font-bold whitespace-nowrap" onClick={() => setImagen(t)}>🖼️ Imagen</button>
            </div>
          );
        })}
        {ordenadas.length === 0 && <p className="p-4 text-center text-gray-400">Todavía no se cerró ninguna temporada</p>}
      </div>
      {imagen && <ImagenTemporada temporada={imagen} cerrada={!!imagen.recien} onClose={() => setImagen(null)} />}
    </div>
  );
}

// ============ PANEL ADMIN (con tabs) ============
function PanelAdmin({ jugadores, partidos, temporadas = [], onSalir }) {
  const [tab, setTab] = useState("jugadores");
  return (
    <div className="max-w-3xl mx-auto p-4">
      <div className="flex justify-between items-center mb-4">
        <h1 className="text-2xl font-bold text-[#1B4B7A]">Panel Admin</h1>
        <button className="text-sm text-gray-500 underline" onClick={onSalir}>Salir</button>
      </div>
      <div className="flex flex-wrap gap-2 mb-4">
        {[["jugadores", "Jugadores"], ["fechas", "Fechas / Sorteo"], ["resultados", "Resultados"], ["temporada", "Temporada"]].map(([k, label]) => (
          <button key={k}
            className={`px-3 py-2 rounded-lg text-sm font-bold ${tab === k ? "bg-[#3E7CB1] text-white" : "bg-white text-[#1B4B7A]"}`}
            onClick={() => setTab(k)}>
            {label}
          </button>
        ))}
      </div>
      {tab === "jugadores" && <AdminJugadores jugadores={jugadores} />}
      {tab === "fechas" && <AdminFechas jugadores={jugadores} partidos={partidos} />}
      {tab === "resultados" && <AdminResultados jugadores={jugadores} partidos={partidos} />}
      {tab === "temporada" && <AdminTemporada jugadores={jugadores} partidos={partidos} temporadas={temporadas} />}
    </div>
  );
}

// ============ APP ============
function App() {
  const [jugadores, setJugadores] = useState([]);
  const [partidos, setPartidos] = useState([]);
  const [temporadas, setTemporadas] = useState([]);
  const [vista, setVista] = useState("home"); // home | login | admin
  const [logueado, setLogueado] = useState(false);

  useEffect(() => {
    db.ref("jugadores").on("value", snap => {
      const val = snap.val() || {};
      setJugadores(Object.entries(val).map(([id, v]) => ({ id, ...v })));
    });
    db.ref("partidos").on("value", snap => {
      const val = snap.val() || {};
      setPartidos(Object.entries(val).map(([id, v]) => ({ id, ...v })).filter(p => !p.archivada));
    });
    // Si las reglas de Firebase todavía no dejaban leer "temporadas", la conexión se
    // cancela sola; acá se reintenta cada 5 segundos hasta que funcione.
    const escucharTemporadas = () => {
      db.ref("temporadas").on("value", snap => {
        const val = snap.val() || {};
        setTemporadas(Object.entries(val).map(([id, v]) => ({ id, ...v })));
      }, () => { setTimeout(escucharTemporadas, 5000); });
    };
    escucharTemporadas();
  }, []);

  return (
    <div className="min-h-screen pb-10">
      <nav className="bg-[#12345C] text-white p-3 flex justify-center gap-4">
        <button className="font-bold" onClick={() => setVista("home")}>Inicio</button>
        <button className="font-bold" onClick={() => setVista(logueado ? "admin" : "login")}>Admin</button>
      </nav>
      <div className="bg-[#FFD700] text-[#06131F] text-center text-xs font-bold py-1">DEMO · datos de ejemplo, los cambios no se guardan al recargar</div>

      {vista === "home" && <Home jugadores={jugadores} partidos={partidos} temporadas={temporadas} />}
      {vista === "login" && <LoginAdmin onLogin={() => { setLogueado(true); setVista("admin"); }} />}
      {vista === "admin" && logueado && (
        <PanelAdmin jugadores={jugadores} partidos={partidos} temporadas={temporadas} onSalir={() => { setLogueado(false); setVista("home"); }} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
