name: Alertas de cobro

on:
  schedule:
    - cron: '0 11 * * *' # 11:00 UTC = 8:00 hora Argentina
  workflow_dispatch:
    inputs:
      test:
        description: 'Mandar solo una notificación de prueba'
        type: boolean
        default: false

jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/cobros.mjs
        env:
          TEST: ${{ inputs.test }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
